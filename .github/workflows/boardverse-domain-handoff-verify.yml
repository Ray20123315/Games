name: BoardVerse domain handoff verification

on:
  push:
    branches: [boardverse-domain-handoff-v011]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: BoardVerse
        run: npm install --no-audit --no-fund
      - name: Full regression suite
        working-directory: BoardVerse
        run: npm test
      - name: Production upload dry-run
        run: npx --yes wrangler@4.127.1 versions upload --dry-run --config wrangler.jsonc --tag boardverse-domain-verification --outdir /tmp/boardverse-domain
      - name: Validate production handoff adapter
        run: |
          node --check scripts/wrangler-ci.cjs
          grep -q "versions', 'deploy', '--config', configPath, '--version-tag', versionTag, '-y'" scripts/wrangler-ci.cjs
          grep -q "apiRequest('PUT', '/workers/domains'" scripts/wrangler-ci.cjs
          grep -q "zone_name: PROD_ZONE" scripts/wrangler-ci.cjs
          grep -q "custom domain verified" scripts/wrangler-ci.cjs
