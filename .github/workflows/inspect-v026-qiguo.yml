name: Finalize v0.0.26 Seven Kingdoms
on:
  push:
    branches: [feature/qiguo-xiangqi-v0.0.26]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create formal deterministic patch
        run: |
          cp BoardVerse/simulate-v026.mjs BoardVerse/post-build-v026.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('BoardVerse/post-build-v026.mjs')
          s=p.read_text()
          needle='await writeFile(worker,source,"utf8");'
          guard='const expectedOutputHash = "99034cdba2d1b72473ef50fc5ad0b190f007cb4638d40dddd7ce8959a9606fd0";\nif (outHash !== expectedOutputHash) throw new Error(`v0.0.26 output hash mismatch: ${outHash}`);\n'
          if needle not in s: raise SystemExit('write marker missing')
          s=s.replace(needle,guard+needle,1)
          p.write_text(s)
          w=Path('BoardVerse/wrangler.jsonc')
          t=w.read_text()
          old='&& node post-build-v025.mjs"'
          new='&& node post-build-v025.mjs && node post-build-v026.mjs"'
          if old not in t: raise SystemExit('wrangler v025 tail missing')
          w.write_text(t.replace(old,new,1))
          PY
      - name: Verify formal build and exact output
        working-directory: BoardVerse
        run: |
          rm -f worker.js
          node build-worker.mjs
          for v in 009 010 011 012 013 014 015 016 017 018 019 020 021 022 023 024 025 026; do node post-build-v${v}.mjs; done
          node --check worker.js
          test "$(wc -c < worker.js)" = "250901"
          test "$(sha256sum worker.js | cut -d' ' -f1)" = "99034cdba2d1b72473ef50fc5ad0b190f007cb4638d40dddd7ce8959a9606fd0"
          grep -q 'const APP_VERSION = "0.0.26";' worker.js
          grep -q 'const QIGUO_ORDER = \["qin","han","chu","wei","qi","yan","zhao"\]' worker.js
      - name: Verify Cloudflare deploy path
        working-directory: BoardVerse
        run: npx --yes wrangler@4.127.1 deploy --dry-run
      - name: Commit only production files
        run: |
          rm -f BoardVerse/worker.js BoardVerse/simulate-v026.mjs .github/workflows/inspect-v026-qiguo.yml
          git config user.name "raychen"
          git config user.email "150588882+Ray20123315@users.noreply.github.com"
          git add -A
          git status --short
          test "$(git diff --cached --name-only | wc -l)" = "3"
          git diff --cached --name-only | grep -qx 'BoardVerse/post-build-v026.mjs'
          git diff --cached --name-only | grep -qx 'BoardVerse/wrangler.jsonc'
          git diff --cached --name-only | grep -qx '.github/workflows/inspect-v026-qiguo.yml'
          git commit -m "BoardVerse v0.0.26: add Seven Kingdoms Chess"
          git push origin HEAD:feature/qiguo-xiangqi-v0.0.26
