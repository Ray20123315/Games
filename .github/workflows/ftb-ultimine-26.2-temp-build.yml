name: Temporary FTB Ultimine 26.2 Build

on:
  push:
    branches:
      - build-ftb-ultimine-26.2-20260901
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Checkout FTB Library 26.2 port
        uses: actions/checkout@v4
        with:
          repository: Officialy/FTB-Library
          ref: 5c8dd7da8dd6c6ffae9308dd87570c423b2ca291
          path: deps/ftb-library

      - name: Publish FTB Library 26.2 snapshot to Maven Local
        working-directory: deps/ftb-library
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon --stacktrace
          test -d "$HOME/.m2/repository/dev/ftb/mods/ftb-library/26.2.0.8-SNAPSHOT"
          find "$HOME/.m2/repository/dev/ftb/mods" -maxdepth 4 -type f -path '*26.2.0.8-SNAPSHOT*' -print | sort

      - name: Checkout FTB Ranks 26.2 port
        uses: actions/checkout@v4
        with:
          repository: Officialy/FTB-Ranks
          ref: 95d5bf74df289f2824f1531cd48b2737235d5b0c
          path: deps/ftb-ranks

      - name: Publish FTB Ranks 26.2 snapshot to Maven Local
        working-directory: deps/ftb-ranks
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon --stacktrace
          test -d "$HOME/.m2/repository/dev/ftb/mods/ftb-ranks/26.2.0.3-SNAPSHOT"
          find "$HOME/.m2/repository/dev/ftb/mods" -maxdepth 4 -type f -path '*26.2.0.3-SNAPSHOT*' -print | sort

      - name: Checkout FTB Ultimine 26.2 source
        uses: actions/checkout@v4
        with:
          repository: Ray20123315/FTB-Ultimine
          ref: 74506b78901581b962d6f503d612235df06c0b1c
          path: ftb-ultimine

      - name: Build FTB Ultimine
        working-directory: ftb-ultimine
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Collect production JARs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find ftb-ultimine/fabric/build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-javadoc.jar' \
            -exec cp -v '{}' dist/ ';'
          find ftb-ultimine/neoforge/build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-javadoc.jar' \
            -exec cp -v '{}' dist/ ';'
          test -n "$(find dist -maxdepth 1 -type f -name '*.jar' -print -quit)"
          sha256sum dist/*.jar | tee dist/SHA256SUMS.txt
          ls -lah dist

      - name: Upload FTB Ultimine 26.2 JARs
        uses: actions/upload-artifact@v4
        with:
          name: ftb-ultimine-26.2-jars
          path: dist/*
          if-no-files-found: error
          retention-days: 7
