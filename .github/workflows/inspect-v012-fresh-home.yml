name: Verify v0.1.2 final
on:
  push:
    branches: [feat/admin-workbench-v0.1.2]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: BoardVerse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --ignore-scripts
      - name: Full regression suite
        run: npm test
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Find Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
      - name: Start branch Worker
        run: |
          npx wrangler dev --local --port 8787 > /tmp/wrangler.log 2>&1 &
          echo $! > /tmp/wrangler.pid
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8787/ >/dev/null 2>&1 && exit 0; sleep 1; done
          cat /tmp/wrangler.log
          exit 1
      - name: Fresh browser homepage must stay responsive
        env:
          TARGET_URL: http://127.0.0.1:8787/
        run: timeout 35s node test/fresh-home-inspect.mjs
      - name: Production deploy dry-run
        run: npx wrangler deploy --dry-run --outdir dist --config wrangler.jsonc
      - name: Wrangler log
        if: always()
        run: tail -120 /tmp/wrangler.log 2>/dev/null || true
