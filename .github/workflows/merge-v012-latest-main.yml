name: Merge v0.1.2 onto latest main
on:
  push:
    branches: [feat/admin-workbench-v0.1.2]
permissions:
  contents: write
jobs:
  merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge latest main and resolve known conflicts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            git checkout --theirs BoardVerse/src/admin/api.js
            git checkout --ours BoardVerse/src/admin/pages.js
            git checkout --ours BoardVerse/src/index-v011.js
            git checkout --theirs BoardVerse/src/ui/feature-policy.js
            git checkout --theirs BoardVerse/test/feature-policy.test.mjs
            git checkout --ours BoardVerse/test/i18n.test.mjs
            git add BoardVerse/src/admin/api.js BoardVerse/src/admin/pages.js BoardVerse/src/index-v011.js BoardVerse/src/ui/feature-policy.js BoardVerse/test/feature-policy.test.mjs BoardVerse/test/i18n.test.mjs
          fi
          cd BoardVerse
          node tools/merge-v012-main.mjs
          cd ..
          git add BoardVerse
          if git diff --name-only --diff-filter=U | grep .; then
            echo 'Unresolved merge conflicts remain'
            exit 1
          fi
      - name: Install dependencies
        working-directory: BoardVerse
        run: npm install --ignore-scripts
      - name: Full regression suite
        working-directory: BoardVerse
        run: npm test
      - name: Production dry-run
        working-directory: BoardVerse
        run: npx wrangler deploy --dry-run --outdir dist --config wrangler.jsonc
      - name: Fresh browser smoke
        working-directory: BoardVerse
        run: |
          npm install --no-save --ignore-scripts puppeteer-core@24
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          npx wrangler dev --local --port 8787 >/tmp/wrangler-v012.log 2>&1 &
          WPID=$!
          trap 'kill $WPID 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8787/ >/dev/null 2>&1 && break; sleep 1; done
          cat >/tmp/fresh-v012.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({executablePath:process.env.CHROME,args:['--no-sandbox','--disable-setuid-sandbox'],headless:true});
          const page=await browser.newPage();
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          await page.goto('http://127.0.0.1:8787/',{waitUntil:'domcontentloaded',timeout:20000});
          const first=await page.evaluate(()=>({ready:document.readyState,title:document.title,body:document.body&&document.body.innerText.slice(0,80)}));
          await new Promise(r=>setTimeout(r,1200));
          const heartbeat=await page.evaluate(()=>new Promise(resolve=>setTimeout(()=>resolve('ok'),20)));
          console.log(JSON.stringify({first,heartbeat,errors},null,2));
          if(heartbeat!=='ok'||!first.body)process.exit(2);
          if(errors.some(x=>/MutationObserver|CONNECTING|syncMultiplayerGameOptions|ReferenceError|TypeError/.test(x)))process.exit(3);
          await browser.close();
          EOF
          CHROME="$CHROME" node /tmp/fresh-v012.mjs
      - name: Commit verified merge
        run: |
          git status --short
          git commit -m 'merge: integrate v0.1.2 with latest main'
          git push origin HEAD:feat/admin-workbench-v0.1.2
