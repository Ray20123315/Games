name: Reconcile v0.1.2 latest main
on:
  push:
    branches: [feat/admin-workbench-v0.1.2]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge latest main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true
          # Keep v0.1.2 package metadata, but include the newest main regression test.
          git checkout --ours -- BoardVerse/package.json
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          pkg=Path('BoardVerse/package.json')
          data=json.loads(pkg.read_text())
          test=data['scripts']['test']
          if 'test/admin-context-bulk.test.mjs' not in test:
              test=test.replace('node test/admin-workbench.test.mjs', 'node test/admin-context-bulk.test.mjs && node test/admin-workbench.test.mjs')
          data['scripts']['test']=test
          pkg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')

          p=Path('BoardVerse/tools/reconcile-v012-main.mjs')
          s=p.read_text()
          pat=r"  s = one\(s, \"if\(key==='rooms'\).*?'users configure path'\);"
          repl="  s = one(s, \"if(key==='users'){toolsUsers();loadUsers('');return}\", \"if(key==='users'){userToolbar();toolsUsers();loadUsers('');return}\", 'users configure path');"
          s2,n=re.subn(pat,repl,s,count=1)
          if n!=1: raise SystemExit(f'configure anchor patch hits={n}')
          p.write_text(s2)
          PY
          git add BoardVerse/package.json
          node BoardVerse/tools/reconcile-v012-main.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Preserve latest-main context bulk router/UI on top of v0.1.2's pause + signed-in header wrapper.
          p=Path('BoardVerse/src/index-v011.js')
          s=p.read_text()
          s=s.replace('import { withDatabaseEnv } from "./core/db.js";','import { requireDb, withDatabaseEnv } from "./core/db.js";',1)
          s=s.replace('import { adminPlayerEntitlement } from "./admin/auth.js";','import { adminPlayerEntitlement, requireAdmin } from "./admin/auth.js";',1)
          s=s.replace('import { errorJson, json } from "./core/http.js";','import { errorJson, json, toErrorResponse } from "./core/http.js";',1)
          level='import { injectAdminLevelPanel } from "./admin/level-ui.js";'
          if level not in s: raise SystemExit('admin level import missing after reconciliation')
          s=s.replace(level,level+'\nimport { ADMIN_CONTEXT_BULK_SCRIPT } from "./admin/context-bulk-ui.js";\nimport { contextAdminApi, isContextAdminApi } from "./admin/context-actions.js";',1)
          s=s.replace('function injectSiteScripts(source) {','function injectSiteScripts(source, pathname) {',1)
          marker='  if (!source.includes(\'id="boardverse-feature-policy"\')) scripts += FEATURE_POLICY_SCRIPT;'
          if marker not in s: raise SystemExit('feature policy script marker missing')
          s=s.replace(marker,marker+'\n  if (pathname.startsWith("/admin/") && !source.includes(\'id="boardverse-admin-context-bulk"\')) scripts += ADMIN_CONTEXT_BULK_SCRIPT;',1)
          envline='    const effectiveEnv = withDatabaseEnv(env);'
          handler='''    if (isContextAdminApi(requestUrl.pathname)) {\n      try {\n        const adm = await requireAdmin(effectiveEnv, request);\n        const data = await contextAdminApi({ db: requireDb(effectiveEnv), env: effectiveEnv, request, path: requestUrl.pathname, actor: adm.user });\n        return json({ ok: true, data });\n      } catch (error) {\n        return toErrorResponse(error);\n      }\n    }'''
          if handler not in s:
              s=s.replace(envline,envline+'\n'+handler,1)
          old='    const localized = injectSiteScripts(injectPublicNav(withAdminLevel, requestUrl.pathname, navAccount));'
          new='    const localized = injectSiteScripts(injectPublicNav(withAdminLevel, requestUrl.pathname, navAccount), requestUrl.pathname);'
          if old not in s: raise SystemExit('localized context injection anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('BoardVerse/test/i18n.test.mjs')
          s=p.read_text()
          anchor='const adminPages = await readFile(new URL("../src/admin/pages.js", import.meta.url), "utf8").catch(() => "");'
          if anchor not in s: raise SystemExit('adminPages i18n anchor missing')
          s=s.replace(anchor,anchor+'\nconst adminWorkbench = await readFile(new URL("../src/admin/workbench.js", import.meta.url), "utf8").catch(() => "");',1)
          pat=r"if \(adminPages\) \{[\s\S]*?\n\}"
          repl='''if (adminPages) {\n  assert.match(adminPages, /ADMIN_WORKBENCH_STYLE/);\n  assert.match(adminPages, /ADMIN_WORKBENCH_SCRIPT/);\n}\nif (adminWorkbench) {\n  assert.match(adminWorkbench, /帳號/);\n  assert.match(adminWorkbench, /房間/);\n  assert.match(adminWorkbench, /Replay/);\n  assert.match(adminWorkbench, /Audit Log/);\n  assert.match(adminWorkbench, /批量管理/);\n  assert.match(adminWorkbench, /管理/);\n  assert.match(adminWorkbench, /操作/);\n}'''
          s2,n=re.subn(pat,repl,s,count=1)
          if n!=1: raise SystemExit(f'admin i18n assertion replacement hits={n}')
          p.write_text(s2)

          p=Path('BoardVerse/test/feature-policy.test.mjs')
          s=p.read_text()
          s=s.replace('assert.match(workbench, /id="bulkManageBtn"/);','assert.match(workbench, /bulkManageBtn/);')
          s=s.replace('assert.match(workbench, /id="selectAllUsers"/);','assert.match(workbench, /selectAllUsers/);')
          s=s.replace('assert.match(adminApi, /results\\.push\\(\\{ username: user\\.username_display, ok: true \\}\\)/);','assert.match(adminApi, /results\\.push\\(\\{\\s*username:\\s*user\\.username_display,\\s*ok:\\s*true\\s*\\}\\)/);')
          s=s.replace('assert.match(adminApi, /action === "confirmed_cheating"/);','assert.match(adminApi, /action\\s*===\\s*"confirmed_cheating"/);')
          s=s.replace('assert.match(adminApi, /applyDiscipline\\(db, user\\.id, action/);','assert.match(adminApi, /applyDiscipline\\(db,\\s*user\\.id,\\s*action/);')
          p.write_text(s)
          PY
          git add BoardVerse/src/index-v011.js BoardVerse/test/i18n.test.mjs BoardVerse/test/feature-policy.test.mjs
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Install dependencies
        working-directory: BoardVerse
        run: npm install --ignore-scripts
      - name: Full regression suite
        working-directory: BoardVerse
        run: npm test
      - name: Browser and deploy verification
        working-directory: BoardVerse
        run: |
          npm install --no-save --ignore-scripts puppeteer-core@24
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          npx wrangler dev --local --port 8787 >/tmp/wrangler.log 2>&1 &
          wp=$!
          trap 'kill $wp 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8787/ >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/ >/dev/null
          CHROME="$CHROME" node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage'],protocolTimeout:20000});
          try{
            const page=await browser.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(String(e?.stack||e)));
            await page.goto('http://127.0.0.1:8787/',{waitUntil:'domcontentloaded',timeout:15000});
            await new Promise(r=>setTimeout(r,1200));
            const state=await Promise.race([page.evaluate(()=>({ready:document.readyState,form:!!document.getElementById('createForm'),cards:document.querySelectorAll('.game-card').length})),new Promise((_,rej)=>setTimeout(()=>rej(new Error('homepage evaluation watchdog')),5000))]);
            console.log('FRESH_HOME',state,errors);
            if(!state.form||state.cards<1)throw new Error('homepage content missing');
            if(errors.some(x=>/read only property 'CONNECTING'|syncMultiplayerGameOptions|MutationObserver/i.test(x)))throw new Error(errors.join('\n'));
          } finally { await browser.close(); }
          NODE
          npx wrangler deploy --dry-run --outdir dist --config wrangler.jsonc
      - name: Commit reconciled branch
        run: |
          git add BoardVerse .github/workflows/inspect-v012-main-merge.yml
          git commit -m 'merge: reconcile BoardVerse v0.1.2 with latest main'
          git push origin HEAD:feat/admin-workbench-v0.1.2
