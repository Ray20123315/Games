name: BoardVerse v026 staging verification

on:
  push:
    branches:
      - boardverse-full-ui-parity-v026

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: BoardVerse
    env:
      WORKERS_CI: "1"
      WORKERS_CI_BRANCH: boardverse-full-ui-parity-v026
      WRANGLER_CI_OVERRIDE_NAME: games
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check v026 sources
        run: |
          node --check src/ui/page-parity-v026.js
          node --check src/index-v025.js
          node test/ui-parity-v026.test.mjs
      - name: Run canonical BoardVerse validation
        run: node build-worker.mjs
