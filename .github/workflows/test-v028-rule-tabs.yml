name: Test v0.0.28 rule detail tabs
on:
  push:
    branches: [feat/rule-detail-tabs-v0.0.28]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and simulate v0.0.28
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          for v in 009 010 011 012 013 014 015 016 017 018 019 020 021 022 023 024 025 026 027; do node post-build-v${v}.mjs; done
          node sim-v028.mjs
          node --check worker.js
      - name: Verify tabbed modal behavior markers
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const s=await readFile('worker.js','utf8');
          const must=[
            'const APP_VERSION = "0.0.28";',
            "tabs.setAttribute('role','tablist')",
            "tab.setAttribute('role','tab')",
            "panel.setAttribute('role','tabpanel')",
            "'遊戲方式'",
            "'規則設定'",
            "'補充規則'",
            "e.key==='ArrowRight'",
            "e.key==='ArrowLeft'",
            "e.key==='Home'",
            "e.key==='End'",
            "tab.setAttribute('aria-selected',on?'true':'false')",
            '這個棋類目前沒有額外補充規則。',
            '.rule-detail-tab[aria-selected="true"]'
          ];
          for(const m of must) if(!s.includes(m)) throw new Error('missing '+m);
          console.log('V028_FINAL_BYTES='+Buffer.byteLength(s));
          console.log('V028_FINAL_SHA256='+createHash('sha256').update(s).digest('hex'));
          NODE
