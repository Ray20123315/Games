name: Test v0.0.28 rule detail tabs
on:
  push:
    branches: [feat/rule-detail-tabs-v0.0.28]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full deterministic v0.0.28 build
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          for v in 009 010 011 012 013 014 015 016 017 018 019 020 021 022 023 024 025 026 027 028; do node post-build-v${v}.mjs; done
          node --check worker.js
      - name: Verify exact output and accessible tabs
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const s=await readFile('worker.js','utf8');
          const hash=createHash('sha256').update(s).digest('hex');
          if(Buffer.byteLength(s)!==262852) throw new Error('unexpected bytes '+Buffer.byteLength(s));
          if(hash!=='699312a341dcba152118bc8c66cfc4afba1355d121929f9e91948807eb14e7ab') throw new Error('unexpected SHA '+hash);
          const must=[
            'const APP_VERSION = "0.0.28";',
            "tabs.setAttribute('role','tablist')",
            "tab.setAttribute('role','tab')",
            "panel.setAttribute('role','tabpanel')",
            "tab.setAttribute('aria-controls','rule-detail-panel-'",
            "panel.setAttribute('aria-labelledby',tab.id)",
            "'遊戲方式'",
            "'規則設定'",
            "'補充規則'",
            "e.key==='ArrowRight'",
            "e.key==='ArrowLeft'",
            "e.key==='Home'",
            "e.key==='End'",
            "tab.setAttribute('aria-selected',on?'true':'false')",
            '這個棋類目前沒有額外補充規則。',
            '.rule-detail-tab[aria-selected="true"]'
          ];
          for(const m of must) if(!s.includes(m)) throw new Error('missing '+m);
          console.log('V028_FINAL_BYTES='+Buffer.byteLength(s));
          console.log('V028_FINAL_SHA256='+hash);
          NODE
      - name: Verify Cloudflare deploy path
        working-directory: BoardVerse
        run: npx --yes wrangler@4.127.1 deploy --dry-run
