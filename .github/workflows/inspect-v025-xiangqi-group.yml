name: Inspect BoardVerse v0.0.25 selector
on:
  push:
    branches: [fix/group-xiangqi-variants-v0.0.25]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v0.0.24
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          for v in 009 010 011 012 013 014 015 016 017 018 019 020 021 022 023 024; do node post-build-v${v}.mjs; done
          node --check worker.js
      - name: Print selector function
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const s=await readFile('worker.js','utf8');
          const a=s.indexOf('function renderGameCatalog()');
          if(a<0) throw new Error('renderGameCatalog missing');
          const b=s.indexOf('function ',a+20);
          console.log('---SELECTOR---');
          console.log(s.slice(a,b>0?b:a+4000));
          console.log('---END---');
          NODE
