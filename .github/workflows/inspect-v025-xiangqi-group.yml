name: Verify BoardVerse v0.0.25 selector
on:
  push:
    branches: [fix/group-xiangqi-variants-v0.0.25]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build formal v0.0.25
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          for v in 009 010 011 012 013 014 015 016 017 018 019 020 021 022 023 024 025; do node post-build-v${v}.mjs; done
          node --check worker.js
      - name: Verify selector grouping and hash
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const s=await readFile('worker.js','utf8');
          const h=createHash('sha256').update(s).digest('hex');
          if(Buffer.byteLength(s)!==228050) throw new Error('unexpected bytes '+Buffer.byteLength(s));
          if(h!=='5953ff897a8d6256cf03336b8864ad8388ed3ee00d53d5d914d6347e6c84d2a1') throw new Error('unexpected hash '+h);
          for(const m of ['const APP_VERSION = "0.0.25";','Xiangqi & variants','象棋与变种','象棋與變種',"id==='xiangqi'||id==='banqi'||id==='xiangqi_random'"]) if(!s.includes(m)) throw new Error('missing '+m);
          console.log('FINAL_V025_BYTES='+Buffer.byteLength(s));
          console.log('FINAL_V025_SHA256='+h);
          NODE
      - name: Verify Cloudflare deploy path safely
        working-directory: BoardVerse
        run: npx --yes wrangler@4.127.1 deploy --dry-run
