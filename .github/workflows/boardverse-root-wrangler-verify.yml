name: BoardVerse root Wrangler redirect verification

on:
  push:
    branches:
      - boardverse-root-wrangler-fix

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify root redirect file
        run: |
          test -f .wrangler/deploy/config.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('.wrangler/deploy/config.json','utf8'));if(x.configPath!=='../../BoardVerse/wrangler.jsonc')process.exit(1)"
      - name: Install BoardVerse dependencies
        working-directory: BoardVerse
        run: npm install
      - name: Full BoardVerse regression suite
        working-directory: BoardVerse
        run: npm test
      - name: Wrangler dry-run from repository root
        run: npx wrangler@4.127.1 deploy --dry-run --outdir BoardVerse/dist-root-config
