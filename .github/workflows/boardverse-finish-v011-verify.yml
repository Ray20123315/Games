name: BoardVerse v0.1.1 final visible deployment verification

on:
  push:
    branches: [boardverse-finish-visible-deploy-v011]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install BoardVerse dependencies
        working-directory: BoardVerse
        run: npm ci
      - name: Full regression suite
        working-directory: BoardVerse
        run: npm test
      - name: Production Wrangler dry-run
        working-directory: BoardVerse
        run: npx wrangler@4.127.1 deploy --dry-run --config wrangler.jsonc --outdir dist-final
      - name: Verify public and database source authority
        run: |
          grep -q 'href="/login"' BoardVerse/src/index-v011.js
          grep -q 'href="/register"' BoardVerse/src/index-v011.js
          grep -q 'href="/report"' BoardVerse/src/index-v011.js
          grep -q 'href="/admin"' BoardVerse/src/index-v011.js
          grep -q 'BOARDVERSE_DB_DO' BoardVerse/wrangler.jsonc
          grep -q 'BoardVerseDb' BoardVerse/src/db/BoardVerseDb.js
          test ! -f .wrangler/deploy/config.json
