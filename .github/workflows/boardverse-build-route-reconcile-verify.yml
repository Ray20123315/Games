name: BoardVerse active build route reconciliation verification

on:
  push:
    branches: [boardverse-build-route-reconcile-v011]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: BoardVerse
        run: npm install --no-audit --no-fund
      - name: Active Cloudflare build gate
        working-directory: BoardVerse
        run: node build-worker.mjs
      - name: Validate production-only routing reconciliation
        working-directory: BoardVerse
        run: |
          node --check build-worker.mjs
          grep -q 'CLOUDFLARE_API_TOKEN' build-worker.mjs
          grep -q 'accountRequest("PUT", "/workers/domains"' build-worker.mjs
          grep -q '/workers/routes' build-worker.mjs
          grep -q 'repointing Worker Route' build-worker.mjs
          grep -q 'Worker Route verified' build-worker.mjs
          grep -q 'production routing read-back passed' build-worker.mjs
          grep -q 'preview/local build: skipping production Cloudflare routing mutations' build-worker.mjs
