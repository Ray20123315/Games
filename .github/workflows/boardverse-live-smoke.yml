name: BoardVerse live production smoke

on:
  push:
    branches: [boardverse-live-smoke-v011]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production surfaces
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://xn--gmqt6w03b11v.ray2025.com'
          tmp="$(mktemp -d)"

          home_code=$(curl --retry 3 --retry-delay 2 -sS -o "$tmp/home.html" -w '%{http_code}' "$BASE/")
          echo "HOME=$home_code"
          test "$home_code" = 200
          grep -q 'id="bvPublicNav"' "$tmp/home.html"
          grep -q 'href="/login"' "$tmp/home.html"
          grep -q 'href="/register"' "$tmp/home.html"
          grep -q 'href="/report"' "$tmp/home.html"
          grep -q 'href="/admin"' "$tmp/home.html"
          grep -q 'v0.1.1' "$tmp/home.html"

          admin_code=$(curl --retry 3 --retry-delay 2 -sS -D "$tmp/admin.headers" -o /dev/null -w '%{http_code}' "$BASE/admin")
          echo "ADMIN=$admin_code"
          test "$admin_code" = 302
          grep -qi '^location: .*\/admin/' "$tmp/admin.headers"

          for path in admin/ report register login; do
            code=$(curl --retry 3 --retry-delay 2 -sS -o "$tmp/${path//\//_}.html" -w '%{http_code}' "$BASE/$path")
            echo "${path^^}=$code"
            test "$code" != 404
            test "$code" -ge 200
            test "$code" -lt 400
          done

          echo 'LIVE_SURFACES=PASS'
