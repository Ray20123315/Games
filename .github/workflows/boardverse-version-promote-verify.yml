name: BoardVerse production version promotion verification

on:
  push:
    branches: [boardverse-prod-version-promote-v011]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: BoardVerse
        run: npm install --no-audit --no-fund
      - name: Full regression suite
        working-directory: BoardVerse
        run: npm test
      - name: Production version upload dry-run
        run: npx --yes wrangler@4.127.1 versions upload --dry-run --config wrangler.jsonc --tag boardverse-verification --outdir /tmp/boardverse-version-upload
      - name: Verify Wrangler promotion CLI
        run: |
          npx --yes wrangler@4.127.1 versions deploy --help > /tmp/versions-deploy-help.txt
          grep -q -- '--version-tag' /tmp/versions-deploy-help.txt
          grep -q -- '--message' /tmp/versions-deploy-help.txt
          grep -q -- '--config' /tmp/versions-deploy-help.txt
          node --check scripts/wrangler-ci.cjs
          grep -q "versions', 'upload', '--config', configPath, '--tag', versionTag" scripts/wrangler-ci.cjs
          grep -q "versions', 'deploy', '--config', configPath, '--version-tag', versionTag, '-y'" scripts/wrangler-ci.cjs
