name: Test v0.0.29 rule contrast
on:
  push:
    branches: [feat/rule-contrast-v0.0.29]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full deterministic v0.0.29 build
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          for v in 009 010 011 012 013 014 015 016 017 018 019 020 021 022 023 024 025 026 027 028 029; do node post-build-v${v}.mjs; done
          node --check worker.js
      - name: Verify exact output and contrast fix
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const s=await readFile('worker.js','utf8'), hash=createHash('sha256').update(s).digest('hex');
          if(Buffer.byteLength(s)!==263107) throw new Error('unexpected bytes '+Buffer.byteLength(s));
          if(hash!=='650d3f3e2931dc6ac214f0bbb3cea093ef6693b66e18ec020650e98ad35f043a') throw new Error('unexpected SHA '+hash);
          for(const m of ['const APP_VERSION = "0.0.29";','body.page-theme-white .game-rule-detail{color:#3f3527','color:var(--text)}.btn.ghost']) if(!s.includes(m)) throw new Error('missing '+m);
          if(s.includes('background:var(--gold-gradient);color:#1b160d')) throw new Error('stale invalid selected-tab style');
          NODE
      - name: Verify Cloudflare deploy path
        working-directory: BoardVerse
        run: npx --yes wrangler@4.127.1 deploy --dry-run
