name: BoardVerse v029 Go diagnostic

on:
  push:
    branches:
      - boardverse-room-card-singleplayer-ai-v029
    paths:
      - ".github/workflows/boardverse-v029-go-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: BoardVerse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Inspect canonical Go pass implementation
        run: |
          grep -nEi "pass|passes|consecutive|scoreGo|goScore" src/legacy/runtime-v029.js | head -n 120 || true
      - name: Inspect live singleplayer Go state
        run: |
          node --input-type=module <<'NODE'
          import { newSingleplayerSession } from './src/bot/session.js';
          import { GameRoom as CanonicalGameRoom } from './src/legacy/runtime-v029.js';
          const s=await newSingleplayerSession('go9',5,{});
          console.log('INITIAL_GAME',JSON.stringify(s.room.game));
          const human=s.room.members.find(m=>m.id===s.humanMemberId);
          const storage={async get(){return undefined},async put(){},async delete(){},async getAlarm(){return null},async setAlarm(){},async deleteAlarm(){}};
          const e=Object.create(CanonicalGameRoom.prototype);e.env={};e.room=structuredClone(s.room);e.loadPromise=null;e.ctx={storage,getWebSockets(){return[]},acceptWebSocket(){},setWebSocketAutoResponse(){},waitUntil(p){Promise.resolve(p).catch(()=>{})}};e.loadRoom=async()=>e.room;e.saveRoom=async()=>{};e.syncLobby=async()=>{};e.broadcastState=async()=>{};e.updateOfflineAlarm=async()=>{};
          await e.handleMove(human.token,{action:'pass'});
          console.log('AFTER_HUMAN_PASS',JSON.stringify(e.room.game));
          console.log('ROOM_STATUS',e.room.status,JSON.stringify(e.room.result));
          NODE
