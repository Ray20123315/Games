name: BoardVerse final live production diagnostics

on:
  push:
    branches: [boardverse-live-smoke-v011-final]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose production routing and cache
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://xn--gmqt6w03b11v.ray2025.com'
          nonce="$(date +%s)"
          tmp="$(mktemp -d)"

          echo '=== HOME headers ==='
          curl --retry 3 --retry-delay 2 -sS -D "$tmp/home.headers" -o "$tmp/home.html" "$BASE/?boardverse_smoke=$nonce"
          cat "$tmp/home.headers"
          echo '=== HOME markers ==='
          if grep -q 'id="bvPublicNav"' "$tmp/home.html"; then echo 'NAV=present'; else echo 'NAV=absent'; fi
          if grep -q 'v0.1.1' "$tmp/home.html"; then echo 'VERSION_V011=present'; else echo 'VERSION_V011=absent'; fi
          grep -Eo '<title>[^<]*</title>' "$tmp/home.html" | head -1 || true

          echo '=== Endpoint status ==='
          for path in admin admin/ report register login health; do
            safe="${path//\//_}"
            code=$(curl --retry 3 --retry-delay 2 -sS -D "$tmp/$safe.headers" -o "$tmp/$safe.body" -w '%{http_code}' "$BASE/$path?boardverse_smoke=$nonce")
            loc=$(grep -i '^location:' "$tmp/$safe.headers" | tr -d '\r' | head -1 || true)
            cache=$(grep -i '^cf-cache-status:' "$tmp/$safe.headers" | tr -d '\r' | head -1 || true)
            echo "$path=$code ${loc:-no-location} ${cache:-no-cache-header}"
            head -c 180 "$tmp/$safe.body" | tr '\n' ' ' || true
            echo
          done

          echo 'DIAGNOSTIC_COMPLETE=1'
