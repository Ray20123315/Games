name: Verify BoardVerse v0.0.18 black white gold theme
on:
  push:
    branches: [style/black-white-gold-v0.0.18]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v0.0.18
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node post-build-v012.mjs
          node post-build-v013.mjs
          node post-build-v014.mjs
          node post-build-v015.mjs
          node post-build-v016.mjs
          node post-build-v017.mjs
          node post-build-v018.mjs
          node --check worker.js
      - name: Verify theme markers and hash
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const source=await readFile('worker.js','utf8');
          const sha=createHash('sha256').update(source).digest('hex');
          if(Buffer.byteLength(source)!==194916)throw new Error('unexpected bytes '+Buffer.byteLength(source));
          if(sha!=='7df579d9f401754096b85fcd6613ab3016caa6458ff3b2e6baa15c6216f9068e')throw new Error('unexpected sha '+sha);
          for(const marker of ['const APP_VERSION = "0.0.18";','boardversePageTheme','page-theme-black','page-theme-white','role="radiogroup"','id="pageBgBlack"','id="pageBgWhite"','linear-gradient(135deg,#8a6500 0%,#d4af37 48%,#fff0a6 100%)','--accent:#d4af37;--accent2:#ffe49a;','applyPageTheme'])if(!source.includes(marker))throw new Error('missing '+marker);
          for(const forbidden of ['type="color"','pageBgColor','applyPageBackground(','isPageBgColor(','localStorage.setItem(\'boardversePageBackground\''])if(source.includes(forbidden))throw new Error('forbidden '+forbidden);
          console.log('Verified v0.0.18 '+Buffer.byteLength(source)+' bytes '+sha);
          NODE
