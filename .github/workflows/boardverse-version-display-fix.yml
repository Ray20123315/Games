name: BoardVerse v0.1.0 version display fix

on:
  push:
    branches:
      - boardverse-v010-version-display-fix

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch public version badge and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('BoardVerse/src/ui/enhance.js')
          s = p.read_text(encoding='utf-8')
          old_import = 'import { STUN_URL } from "../core/config.js";'
          new_import = 'import { APP_VERSION, STUN_URL } from "../core/config.js";'
          assert old_import in s and new_import not in s
          s = s.replace(old_import, new_import, 1)
          old = '''export function enhanceLegacyHtml(source) {
            let html = String(source);
          '''
          new = '''export function enhanceLegacyHtml(source) {
            let html = String(source);
            html = html.replace('<span class="small muted">v0.0.29</span>', `<span class="small muted">v${APP_VERSION}</span>`);
          '''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('BoardVerse/test/browser-scripts.test.mjs')
          s = p.read_text(encoding='utf-8')
          old = "import { BRIDGE_SCRIPT, ENHANCE_SCRIPT } from '../src/ui/enhance.js';"
          new = "import { BRIDGE_SCRIPT, ENHANCE_SCRIPT, enhanceLegacyHtml } from '../src/ui/enhance.js';"
          assert old in s
          s = s.replace(old, new, 1)
          marker = "const replay=replayDocument"
          insert = '''const legacyBadge='<html><body><span class="small muted">v0.0.29</span></body></html>';
          const upgradedBadge=enhanceLegacyHtml(legacyBadge);
          assert.match(upgradedBadge,/<span class="small muted">v0\\.1\\.0<\\/span>/,'public version badge must use product version');
          assert.doesNotMatch(upgradedBadge,/>v0\\.0\\.29<\\/span>/,'legacy runtime version must not leak into public badge');
          '''
          assert marker in s
          s = s.replace(marker, insert + marker, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('BoardVerse/test/static.test.mjs')
          s = p.read_text(encoding='utf-8')
          needle = 'const ui=await readFile(new URL("../src/ui/enhance.js",import.meta.url),"utf8"); for(const x of ["navigator.share","getUserMedia","STUN_URL","bvGameFilter","bvReady","undo_request","BoardVerseBridge"]) assert.ok(ui.includes(x),x);\n'
          assert needle in s
          s = s.replace(needle, needle + 'assert.match(ui,/APP_VERSION/); assert.match(ui,/v0\\.0\\.29<\\/span>/);\n', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        working-directory: BoardVerse
        run: npm install

      - name: Full regression suite
        working-directory: BoardVerse
        run: npm test

      - name: Wrangler dry-run
        working-directory: BoardVerse
        run: npx wrangler@4.127.1 deploy --dry-run --outdir dist

      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "raychen"
          git config user.email "150588882+Ray20123315@users.noreply.github.com"
          git rm .github/workflows/boardverse-version-display-fix.yml
          git add BoardVerse/src/ui/enhance.js BoardVerse/test/browser-scripts.test.mjs BoardVerse/test/static.test.mjs
          git commit -m "BoardVerse v0.1.0: fix public version badge"
          git push origin HEAD:boardverse-v010-version-display-fix
