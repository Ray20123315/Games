name: Calculate BoardVerse v0.0.15 plain-language estimate
on:
  push:
    branches: [tmp/go-live-estimate-v015-rebase]
jobs:
  calc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v0.0.14
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node post-build-v012.mjs
          node post-build-v013.mjs
          node post-build-v014.mjs
          node --check worker.js
      - name: Simulate v0.0.15
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          let source=await readFile('worker.js','utf8');
          function replaceExact(from,to,label){const first=source.indexOf(from);if(first<0)throw new Error(label+' marker not found');if(source.indexOf(from,first+from.length)>=0)throw new Error(label+' marker not unique');source=source.replace(from,to)}
          replaceExact('const APP_VERSION = "0.0.14";','const APP_VERSION = "0.0.15";','version');
          replaceExact(
            'function publicGameState(game) {\n  return structuredClone(game);\n}',
            'function publicGameState(game) {\n  const out = structuredClone(game);\n  if (out?.type === "go" && !out.ended) {\n    const rules = out.rules || {};\n    if (rules.mode === "capture") out.liveEstimate = { kind:"capture", B:out.captures?.B || 0, W:out.captures?.W || 0, goal:rules.captureGoal || 1 };\n    else { const score = scoreGo(out); out.liveEstimate = { kind:"score", B:score.B, W:score.W, scoring:rules.scoring || "area" }; }\n  }\n  return out;\n}',
            'public Go estimate'
          );
          replaceExact('.board-bg-setting{display:flex;','.go-estimate{margin-top:8px;padding:8px 10px;border:1px solid #2d425b;border-radius:10px;background:#0b1621;color:#c9d5e3;font-size:12px;line-height:1.5}.board-bg-setting{display:flex;','Go estimate css');
          replaceExact('<section class="status-card card"><div id="turnInfo" class="turn-banner"></div><div id="roleInfo" class="role-line"></div><div id="resultBanner"','<section class="status-card card"><div id="turnInfo" class="turn-banner"></div><div id="roleInfo" class="role-line"></div><div id="goEstimate" class="go-estimate hidden"></div><div id="resultBanner"','Go estimate UI');
          replaceExact(
            'function renderStatus(r){var g=r.gameState;',
            `function goEstimateNumber(n){var x=Number(n)||0;return Math.round(x*10)/10}\nfunction goPositionText(d,unit){var a=Math.abs(d),u=unit||'';if(d===0)return lang==='en'?'Current position: even':lang==='zh-Hans'?'当前形势：双方持平':'目前形勢：雙方持平';if(d>0)return lang==='en'?'Current position: Black leads by '+a+u+' (White trails by '+a+u+')':lang==='zh-Hans'?'当前形势：黑方领先 '+a+u+'（白方落后 '+a+u+'）':'目前形勢：黑方領先 '+a+u+'（白方落後 '+a+u+'）';return lang==='en'?'Current position: White leads by '+a+u+' (Black trails by '+a+u+')':lang==='zh-Hans'?'当前形势：白方领先 '+a+u+'（黑方落后 '+a+u+'）':'目前形勢：白方領先 '+a+u+'（黑方落後 '+a+u+'）'}\nfunction renderGoEstimate(r,g){var el=$('goEstimate');if(!el)return;var e=g&&g.liveEstimate;if(!e||g.type!=='go'||r.status!=='playing'){el.classList.add('hidden');el.textContent='';return}el.classList.remove('hidden');var B=goEstimateNumber(e.B),W=goEstimateNumber(e.W),d=goEstimateNumber(B-W);if(e.kind==='capture'){var label=lang==='en'?'Capture Go progress':lang==='zh-Hans'?'吃子棋进度':'吃子棋進度',goal=lang==='en'?'goal ':'目標 ',unit=lang==='en'?' captures':' 子';el.textContent=label+': B '+B+' / W '+W+' · '+goal+goEstimateNumber(e.goal)+' · '+goPositionText(d,unit);return}var label2=lang==='en'?'Live estimate':lang==='zh-Hans'?'实时估算':'即時估算',suffix=lang==='en'?' · life/death unresolved':' · 未判定死活',unit2=lang==='en'?' pts':' 目';el.textContent=label2+': B '+B+' / W '+W+' · '+goPositionText(d,unit2)+suffix}\nfunction renderStatus(r){var g=r.gameState;`,
            'Go estimate renderer'
          );
          replaceExact(`$('roleInfo').textContent=role;$('passBtn')`,`$('roleInfo').textContent=role;renderGoEstimate(r,g);$('passBtn')`,'Go estimate status hook');
          const out=Buffer.from(source,'utf8');await writeFile('worker.js',out);
          console.log('V015_BYTES='+out.length);console.log('V015_SHA256='+createHash('sha256').update(out).digest('hex'));
          for(const marker of ['liveEstimate','goEstimate','scoreGo(out)','目前形勢：黑方領先','白方落後','目前形勢：雙方持平','Capture Go progress'])if(!source.includes(marker))throw new Error('missing '+marker);
          NODE
          node --check worker.js
