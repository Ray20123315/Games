name: Verify BoardVerse v0.0.15 plain-language estimate
on:
  push:
    branches: [tmp/go-live-estimate-v015-rebase]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v0.0.15
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node post-build-v012.mjs
          node post-build-v013.mjs
          node post-build-v014.mjs
          node post-build-v015.mjs
          node --check worker.js
      - name: Verify hash and plain-language markers
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const source=await readFile('worker.js','utf8');
          const expected='1587eaa1a6ec18b4ebc1a38c5c94fc4b6af0a9f73e25c816adbb8c763ff4f1c9';
          const actual=createHash('sha256').update(Buffer.from(source,'utf8')).digest('hex');
          if(actual!==expected)throw new Error('unexpected SHA '+actual);
          for(const marker of ['const APP_VERSION = "0.0.15";','scoreGo(out)','out.liveEstimate = { kind:"score"','out.liveEstimate = { kind:"capture"','id="goEstimate"','目前形勢：黑方領先','白方落後','目前形勢：雙方持平','未判定死活','Capture Go progress'])if(!source.includes(marker))throw new Error('missing '+marker);
          console.log('V015_SHA256='+actual);
          console.log('V015_BYTES='+Buffer.byteLength(source,'utf8'));
          NODE
