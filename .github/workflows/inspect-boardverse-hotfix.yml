name: Inspect BoardVerse hotfix
on:
  push:
    branches: [hotfix/game-end-resign-v0.0.12]
  pull_request:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build current worker
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node --check worker.js
      - name: Show exact end-condition source
        working-directory: BoardVerse
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('worker.js').read_text()
          anchors=[
            'function applyGameAction',
            'function applyGo',
            'function applyGomoku',
            'function applyRenju',
            'function applyXiangqi',
            'function applyChess',
            'function applyReversi',
            'resignBtn',
            'confirmResign',
            'match_end',
            'resultBanner',
          ]
          for term in anchors:
              print('\n===== ANCHOR',term,'=====')
              start=0
              count=0
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  print('\n--- occurrence',count+1,'at',i,'---')
                  print(s[max(0,i-1200):min(len(s),i+9000)])
                  start=i+len(term)
                  count+=1
                  if count>=12: break
          PY
