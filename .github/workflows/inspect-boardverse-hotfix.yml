name: Verify BoardVerse hotfix
on:
  push:
    branches: [hotfix/game-end-resign-v0.0.12]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v0.0.12 worker
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node post-build-v012.mjs
          node --check worker.js
      - name: Verify terminal-state hotfix markers
        working-directory: BoardVerse
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          s=Path('worker.js').read_text()
          checks={
            'version':'const APP_VERSION = "0.0.12";',
            'full_board_draw':'if (next.board.every((cell) => cell != null))',
            'draw_reason':'棋盤已滿且無勝線，和棋',
            'seated_resign_guard':'auth.member.role !== "player" || !room.seats.includes(auth.member.id)',
            'finish_idempotency':'if (!room || room.status !== "playing") return;',
            'terminal_game_state':'if (room.game) { room.game.ended = true;',
            'resign_ws':'send({type:\'resign\'})',
            'go_pass':'send({type:\'pass\'})',
            'server_resign_type':'msg.type === "resign"',
            'server_resign_dispatch':'await this.resign(token)',
          }
          missing=[name for name,marker in checks.items() if marker not in s]
          if missing:
            raise SystemExit('missing markers: '+', '.join(missing))
          if s.count('if (next.board.every((cell) => cell != null))') != 1:
            raise SystemExit('full-board draw marker must be unique')
          actual=hashlib.sha256(s.encode()).hexdigest()
          expected='2d60c0f3379c3837f555c63e9b4b2dc87ffc3d245e66adc43cb8a79d6a04b691'
          if actual != expected:
            raise SystemExit(f'worker sha256 mismatch: {actual}')
          print('Verified:', ', '.join(checks))
          print('worker bytes:', len(s.encode()))
          print('worker sha256:', actual)
          PY
