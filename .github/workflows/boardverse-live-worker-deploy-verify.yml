name: BoardVerse direct live Worker deployment verification

on:
  push:
    branches: [boardverse-deploy-live-worker-v011]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: BoardVerse
        run: npm install --no-audit --no-fund
      - name: Cloudflare build command compatibility
        working-directory: BoardVerse
        run: node build-worker.mjs
      - name: Verify live Worker target
        working-directory: BoardVerse
        run: |
          node --check build-worker.mjs
          grep -q '"name": "crimson-haze-0a4d"' wrangler.jsonc
          grep -q '"main": "src/index-v011.js"' wrangler.jsonc
          grep -q '"custom_domain": true' wrangler.jsonc
          ! grep -q 'xn--gmqt6w03b11v.ray2025.com/\*' wrangler.jsonc
