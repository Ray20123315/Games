name: Simulate BoardVerse v0.0.24
on:
  push:
    branches: [feature/game-variants-opening-allocation-v0.0.24]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build current worker
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node post-build-v012.mjs
          node post-build-v013.mjs
          node post-build-v014.mjs
          node post-build-v015.mjs
          node post-build-v016.mjs
          node post-build-v017.mjs
          node post-build-v018.mjs
          node post-build-v019.mjs
          node post-build-v020.mjs
          node post-build-v021.mjs
          node post-build-v022.mjs
          node post-build-v023.mjs
      - name: Inspect pass resign and finish handlers
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const s=await readFile('worker.js','utf8');
          for(const term of ['msg.type === "pass"','msg.type === "resign"','type === "pass"','type === "resign"','finishMatch(','handlePass','handleResign']){
            let at=0,n=0; while((at=s.indexOf(term,at))>=0&&n<5){console.log('\n### '+term+' @ '+at);console.log(s.slice(Math.max(0,at-1600),Math.min(s.length,at+5200)));at+=term.length;n++;}
            if(!n)console.log('\n### '+term+' @ -1');
          }
          NODE
      - name: Simulate v0.0.24
        working-directory: BoardVerse
        run: |
          node sim-v024-compat.mjs
          node sim-v024.mjs
          node --check worker.js
      - name: Verify v0.0.24 markers and hidden-state safety
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const s=await readFile('worker.js','utf8');
          const markers=['const APP_VERSION = "0.0.24";','GAME_CATALOG.banqi','GAME_CATALOG.xiangqi_random','function applyBanqi(','secretParity','publicOpening(room)','opening_guess','opening_hand','roomTimingText(r)','renderBanqi(g,el,interactive)'];
          for(const m of markers) if(!s.includes(m)) throw new Error('missing '+m);
          if(!s.includes('if (out?.type === "banqi" && Array.isArray(out.covered))')) throw new Error('banqi masking missing');
          console.log('V024_BYTES='+Buffer.byteLength(s));
          console.log('V024_SHA256='+createHash('sha256').update(s).digest('hex'));
          NODE
