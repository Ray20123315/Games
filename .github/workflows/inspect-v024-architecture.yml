name: Inspect BoardVerse v0.0.24 architecture
on:
  push:
    branches: [feature/game-variants-opening-allocation-v0.0.24]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build current v0.0.23
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node post-build-v012.mjs
          node post-build-v013.mjs
          node post-build-v014.mjs
          node post-build-v015.mjs
          node post-build-v016.mjs
          node post-build-v017.mjs
          node post-build-v018.mjs
          node post-build-v019.mjs
          node post-build-v020.mjs
          node post-build-v021.mjs
          node post-build-v022.mjs
          node post-build-v023.mjs
          node --check worker.js
      - name: Inspect exact mutation edge cases
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const s=await readFile('worker.js','utf8');
          const needles=['function sideFor(','function sanitizeLobbyRecord(','  async initRoom(','  assignSeat(','  finishMatch(','  archiveReplay(','  async handlePass(','  async handleResign(','  async alarm(','export class GameRoom'];
          for(const needle of needles){
            let from=0,count=0;
            while(true){const i=s.indexOf(needle,from);if(i<0)break;count++;console.log('\n### '+needle+' #'+count+' @ '+i);console.log(s.slice(Math.max(0,i-1200),Math.min(s.length,i+8000)));from=i+needle.length;if(count>=3)break;}
            if(!count)console.log('\n### '+needle+' @ -1');
          }
          NODE
