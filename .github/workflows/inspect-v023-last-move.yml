name: Verify BoardVerse v0.0.23 last move
on:
  push:
    branches: [feature/last-move-dot-v0.0.23]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build simulated v0.0.23
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node post-build-v012.mjs
          node post-build-v013.mjs
          node post-build-v014.mjs
          node post-build-v015.mjs
          node post-build-v016.mjs
          node post-build-v017.mjs
          node post-build-v018.mjs
          node post-build-v019.mjs
          node post-build-v020.mjs
          node post-build-v021.mjs
          node post-build-v022.mjs
          node sim-v023.mjs
          node --check worker.js
      - name: Verify marker and print hash
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const s=await readFile('worker.js','utf8');
          const bytes=Buffer.byteLength(s),sha=createHash('sha256').update(s).digest('hex');
          for(const marker of ['const APP_VERSION = "0.0.23";','id="lastMoveMarkerSetting"','id="lastMoveMarkerToggle"','boardverseLastMoveMarker','hide-last-move-dot','.line-board .point-btn.last::after{z-index:3}','Last move marker','上一手標記','上一手标记'])if(!s.includes(marker))throw new Error('missing '+marker);
          if(!s.includes("['go','gomoku','renju'].indexOf(g.type)<0"))throw new Error('game visibility marker missing');
          console.log('V023_BYTES='+bytes);
          console.log('V023_SHA256='+sha);
          NODE
