name: Inspect BoardVerse v0.0.23 last move
on:
  push:
    branches: [feature/last-move-dot-v0.0.23]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build current v0.0.22
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node post-build-v012.mjs
          node post-build-v013.mjs
          node post-build-v014.mjs
          node post-build-v015.mjs
          node post-build-v016.mjs
          node post-build-v017.mjs
          node post-build-v018.mjs
          node post-build-v019.mjs
          node post-build-v020.mjs
          node post-build-v021.mjs
          node post-build-v022.mjs
          node --check worker.js
      - name: Inspect markers
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const s=await readFile('worker.js','utf8');
          console.log('BYTES='+Buffer.byteLength(s));
          console.log('SHA='+createHash('sha256').update(s).digest('hex'));
          for(const needle of ['id="goEstimate"','id="roleLine"','boardversePageTheme','pageBgBlack','function renderStatus','function renderIntersectionBoard','.point-btn.last::after']){
            const i=s.indexOf(needle); console.log('\n### '+needle+' @ '+i); if(i>=0)console.log(s.slice(Math.max(0,i-1500),i+4500));
          }
          NODE
