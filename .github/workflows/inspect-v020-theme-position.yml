name: Verify BoardVerse v0.0.20 theme placement
on:
  push:
    branches: [feature/queue-rules-v0.0.20]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v0.0.20
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node post-build-v012.mjs
          node post-build-v013.mjs
          node post-build-v014.mjs
          node post-build-v015.mjs
          node post-build-v016.mjs
          node post-build-v017.mjs
          node post-build-v018.mjs
          node post-build-v019.mjs
          node post-build-v020.mjs
          node --check worker.js
      - name: Verify final placement and hash
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const s=await readFile('worker.js','utf8');
          const bytes=Buffer.byteLength(s);
          const sha=createHash('sha256').update(s).digest('hex');
          if(bytes!==201574)throw new Error('unexpected bytes '+bytes);
          if(sha!=='b153db101988e5cd1d1381ff4e4dde2e6caa54036556fb9dc470eded10e7f53a')throw new Error('unexpected sha '+sha);
          const language=s.indexOf('id="languageSelect"');
          const theme=s.indexOf('id="pageThemeChoice"');
          const sound=s.indexOf('class="sound-wrap"');
          if(language<0||theme<0||sound<0)throw new Error('topbar controls missing');
          if(!(language < theme && theme < sound && theme-language < 900))throw new Error('theme is not beside language');
          if((s.match(/id="pageThemeChoice"/g)||[]).length!==1)throw new Error('theme control duplicated');
          if((s.match(/id="pageBgBlack"/g)||[]).length!==1||(s.match(/id="pageBgWhite"/g)||[]).length!==1)throw new Error('theme buttons duplicated');
          if(s.includes('board-bg-setting theme-setting'))throw new Error('old status-card theme control remains');
          for(const marker of ['host_stays','房主留桌','詳細了解規則設定','buildRuleDetailNode','Area 面積計分','Territory 地計分','Positional Superko','Capture Go','讓子'])if(!s.includes(marker))throw new Error('missing '+marker);
          console.log('Verified final v0.0.20 '+bytes+' bytes '+sha);
          NODE
