name: Calculate BoardVerse v0.0.16 page background
on:
  push:
    branches: [fix/page-background-v0.0.16]
jobs:
  calc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v0.0.15
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node post-build-v012.mjs
          node post-build-v013.mjs
          node post-build-v014.mjs
          node post-build-v015.mjs
          node --check worker.js
      - name: Simulate v0.0.16
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          let source=await readFile('worker.js','utf8');
          function replaceExact(from,to,label){const first=source.indexOf(from);if(first<0)throw new Error(label+' marker not found');if(source.indexOf(from,first+from.length)>=0)throw new Error(label+' marker not unique');source=source.replace(from,to)}
          replaceExact('const APP_VERSION = "0.0.15";','const APP_VERSION = "0.0.16";','version');
          replaceExact(
            'body.custom-board-bg .line-board{background:linear-gradient(135deg,var(--board-bg-light),var(--board-bg-dark))}body.custom-board-bg .xiangqi-board{background:linear-gradient(145deg,var(--board-bg-light),var(--board-bg-dark))}body.custom-board-bg .chess-board .sq.light{background:var(--board-bg-light)}body.custom-board-bg .chess-board .sq.dark{background:var(--board-bg-dark)}body.custom-board-bg .reversi-board .sq.light,body.custom-board-bg .reversi-board .sq.dark{background:var(--board-bg);border-color:var(--board-bg-dark)}',
            '',
            'remove board color overrides'
          );
          replaceExact(
            '<div class="board-bg-setting"><label for="boardBgColor"><span id="boardBgLabel">棋盤背景</span><input id="boardBgColor" type="color" value="#c79655" aria-label="棋盤背景"></label><button id="boardBgReset" class="btn ghost" type="button">預設</button></div>',
            '<div class="board-bg-setting"><label for="pageBgColor"><span id="pageBgLabel">頁面背景</span><input id="pageBgColor" type="color" value="#0b1118" aria-label="頁面背景"></label><button id="pageBgReset" class="btn ghost" type="button">預設</button></div>',
            'page background controls'
          );
          replaceExact(
            "function isBoardBgColor(v){return /^#[0-9a-f]{6}$/i.test(String(v||''))}\\nfunction boardBgShade(hex,amount){var n=parseInt(hex.slice(1),16),p=Math.max(-1,Math.min(1,amount)),t=p<0?0:255,q=Math.abs(p),r=n>>16,g=n>>8&255,b=n&255;function c(x){return Math.round((t-x)*q+x).toString(16).padStart(2,'0')}return '#'+c(r)+c(g)+c(b)}\\nfunction applyBoardBackground(value){var v=isBoardBgColor(value)?String(value).toLowerCase():'';document.body.classList.toggle('custom-board-bg',!!v);['--board-bg','--board-bg-light','--board-bg-dark'].forEach(function(k){document.documentElement.style.removeProperty(k)});if(v){document.documentElement.style.setProperty('--board-bg',v);document.documentElement.style.setProperty('--board-bg-light',boardBgShade(v,.24));document.documentElement.style.setProperty('--board-bg-dark',boardBgShade(v,-.2))}return v}\\nfunction refreshBoardBgLabels(){var label=lang==='en'?'Board background':lang==='zh-Hans'?'棋盘背景':'棋盤背景',reset=lang==='en'?'Default':lang==='zh-Hans'?'默认':'預設';$('boardBgLabel').textContent=label;$('boardBgColor').setAttribute('aria-label',label);$('boardBgReset').textContent=reset}\\n",
            "function isPageBgColor(v){return /^#[0-9a-f]{6}$/i.test(String(v||''))}\\nfunction applyPageBackground(value){var v=isPageBgColor(value)?String(value).toLowerCase():'';document.body.classList.remove('custom-board-bg');['--board-bg','--board-bg-light','--board-bg-dark'].forEach(function(k){document.documentElement.style.removeProperty(k)});document.body.style.removeProperty('background');if(v)document.body.style.setProperty('background',v,'important');return v}\\nfunction refreshPageBgLabels(){var label=lang==='en'?'Page background':lang==='zh-Hans'?'页面背景':'頁面背景',reset=lang==='en'?'Default':lang==='zh-Hans'?'默认':'預設';$('pageBgLabel').textContent=label;$('pageBgColor').setAttribute('aria-label',label);$('pageBgReset').textContent=reset}\\n",
            'page background helpers'
          );
          replaceExact(
            "var savedBoardBg=localStorage.getItem('boardverseBoardBackground')||'';if(isBoardBgColor(savedBoardBg))$('boardBgColor').value=savedBoardBg;applyBoardBackground(savedBoardBg);refreshBoardBgLabels();$('languageSelect').addEventListener('change',refreshBoardBgLabels);$('boardBgColor').addEventListener('input',function(){var v=applyBoardBackground(this.value);if(v)localStorage.setItem('boardverseBoardBackground',v)});$('boardBgReset').addEventListener('click',function(){localStorage.removeItem('boardverseBoardBackground');$('boardBgColor').value='#c79655';applyBoardBackground('')});",
            "var savedPageBg=localStorage.getItem('boardversePageBackground')||localStorage.getItem('boardverseBoardBackground')||'';if(isPageBgColor(savedPageBg)){$('pageBgColor').value=savedPageBg;localStorage.setItem('boardversePageBackground',savedPageBg)}localStorage.removeItem('boardverseBoardBackground');applyPageBackground(savedPageBg);refreshPageBgLabels();$('languageSelect').addEventListener('change',refreshPageBgLabels);$('pageBgColor').addEventListener('input',function(){var v=applyPageBackground(this.value);if(v)localStorage.setItem('boardversePageBackground',v)});$('pageBgReset').addEventListener('click',function(){localStorage.removeItem('boardversePageBackground');$('pageBgColor').value='#0b1118';applyPageBackground('')});",
            'page background persistence'
          );
          const out=Buffer.from(source,'utf8');await writeFile('worker.js',out);
          console.log('V016_BYTES='+out.length);console.log('V016_SHA256='+createHash('sha256').update(out).digest('hex'));
          for(const marker of ['Page background','頁面背景','boardversePageBackground','applyPageBackground','document.body.style.setProperty(\'background\',v,\'important\')'])if(!source.includes(marker))throw new Error('missing '+marker);
          for(const forbidden of ['body.custom-board-bg .line-board','boardBgShade(','boardverseBoardBackground\',v'])if(source.includes(forbidden))throw new Error('forbidden '+forbidden);
          NODE
          node --check worker.js
