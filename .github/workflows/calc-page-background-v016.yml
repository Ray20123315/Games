name: Verify BoardVerse v0.0.16 page background
on:
  push:
    branches: [fix/page-background-v0.0.16]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v0.0.16
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node post-build-v012.mjs
          node post-build-v013.mjs
          node post-build-v014.mjs
          node post-build-v015.mjs
          node post-build-v016.mjs
          node --check worker.js
      - name: Verify page background behavior and hash
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const source=await readFile('worker.js','utf8');
          const expected='4797d861c5d5fd6ce4c4ac8af321d8e985945794f09caa5b83e6ac5603f1fae6';
          const actual=createHash('sha256').update(Buffer.from(source,'utf8')).digest('hex');
          if(actual!==expected)throw new Error('unexpected SHA '+actual);
          for(const marker of ['const APP_VERSION = "0.0.16";','Page background','頁面背景','页面背景','id="pageBgColor"','boardversePageBackground','applyPageBackground','document.body.style.setProperty(\'background\',v,\'important\')','localStorage.removeItem(\'boardverseBoardBackground\')'])if(!source.includes(marker))throw new Error('missing '+marker);
          for(const forbidden of ['body.custom-board-bg .line-board','body.custom-board-bg .xiangqi-board','body.custom-board-bg .chess-board','body.custom-board-bg .reversi-board','function boardBgShade('])if(source.includes(forbidden))throw new Error('forbidden '+forbidden);
          console.log('V016_BYTES='+Buffer.byteLength(source,'utf8'));
          console.log('V016_SHA256='+actual);
          NODE
          grep -F 'post-build-v016.mjs' wrangler.jsonc
