name: BoardVerse reconstruct current v0.0.26

on:
  push:
    branches:
      - boardverse-main-v026-reconstruct
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct current worker
        working-directory: BoardVerse
        shell: bash
        run: |
          set -euo pipefail
          node build-worker.mjs
          for v in 009 010 011 012 013 014 015 016 017 018 019 020 021 022 023 024 025 026; do
            node "post-build-v${v}.mjs"
          done
          node --check worker.js
          mkdir -p .migration
          cp worker.js .migration/current-worker-v026.js
          sha256sum worker.js > .migration/current-worker-v026.sha256
          grep -E '^(export |const APP_VERSION|const GAME_CATALOG|const RULE_DEFS|class |function |async function )' worker.js > .migration/current-worker-v026.symbols.txt || true
      - name: Upload exact runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: boardverse-v026-runtime
          path: |
            BoardVerse/.migration/current-worker-v026.js
            BoardVerse/.migration/current-worker-v026.sha256
            BoardVerse/post-build-v024.mjs
            BoardVerse/post-build-v025.mjs
            BoardVerse/post-build-v026.mjs
          if-no-files-found: error
          retention-days: 3
      - name: Commit exact reconstructed worker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BoardVerse/.migration/current-worker-v026.js BoardVerse/.migration/current-worker-v026.sha256 BoardVerse/.migration/current-worker-v026.symbols.txt
          git diff --cached --quiet && exit 0
          git commit -m 'BoardVerse: reconstruct exact v0.0.26 worker'
          git push origin HEAD:boardverse-main-v026-reconstruct
