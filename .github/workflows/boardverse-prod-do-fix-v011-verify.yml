name: BoardVerse v0.1.1 production DO isolation verification

on:
  push:
    branches: [boardverse-finish-visible-deploy-v011]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: BoardVerse
        run: npm install --no-audit --no-fund
      - name: Full regression
        working-directory: BoardVerse
        run: npm test
      - name: Production Wrangler dry-run
        working-directory: BoardVerse
        run: npx wrangler@4.127.1 deploy --dry-run --config wrangler.jsonc --outdir dist-prod-fix
      - name: Verify collision-free DO names
        run: |
          grep -q 'GameRoomV011' BoardVerse/src/index-v011.js
          grep -q 'GlobalChatV011' BoardVerse/src/index-v011.js
          grep -q 'BoardVerseDbV011' BoardVerse/src/index-v011.js
          grep -q 'boardverse-v011-visible-platform-20260829' BoardVerse/wrangler.jsonc
          grep -q 'boardverse-v011-visible-platform-20260829' scripts/wrangler-ci.cjs
