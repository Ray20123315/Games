name: BoardVerse live production surface smoke

on:
  push:
    branches: [boardverse-finish-visible-deploy-v011]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live production surfaces
        shell: bash
        run: |
          set -u
          base='https://xn--gmqt6w03b11v.ray2025.com'
          failed=0

          check_body() {
            label="$1"; url="$2"; pattern="$3"
            body_file="$(mktemp)"
            code="$(curl -sS -L --retry 3 --retry-delay 2 -o "$body_file" -w '%{http_code}' "$url" || echo CURL_ERROR)"
            if [[ "$code" =~ ^2[0-9][0-9]$ ]] && grep -Eq "$pattern" "$body_file"; then
              echo "$label PASS http=$code"
            else
              echo "$label FAIL http=$code"
              failed=1
            fi
          }

          home_file="$(mktemp)"
          home_code="$(curl -sS -L --retry 3 --retry-delay 2 -o "$home_file" -w '%{http_code}' "$base/" || echo CURL_ERROR)"
          if [[ "$home_code" =~ ^2[0-9][0-9]$ ]] \
            && grep -q 'href="/login"' "$home_file" \
            && grep -q 'href="/register"' "$home_file" \
            && grep -q 'href="/report"' "$home_file" \
            && grep -q 'href="/admin"' "$home_file" \
            && grep -q 'v0.1.1' "$home_file"; then
            echo "HOME PASS http=$home_code"
          else
            echo "HOME FAIL http=$home_code"
            failed=1
          fi

          admin_headers="$(mktemp)"
          admin_code="$(curl -sS -o /dev/null -D "$admin_headers" -w '%{http_code}' "$base/admin" || echo CURL_ERROR)"
          if [[ "$admin_code" =~ ^30[1278]$ ]] && grep -Eqi '^location: .*/admin/\r?$' "$admin_headers"; then
            echo "ADMIN_REDIRECT PASS http=$admin_code"
          else
            echo "ADMIN_REDIRECT FAIL http=$admin_code"
            failed=1
          fi

          check_body REPORT "$base/report" 'cf-turnstile|回報'
          check_body REGISTER "$base/register" '註冊|建立帳號'
          check_body LOGIN "$base/login" '登入|登錄'
          check_body ADMIN_LOGIN "$base/admin/" '管理|Admin|登入'

          if [[ "$failed" -ne 0 ]]; then
            echo 'LIVE_SURFACE_SMOKE_FAIL'
            exit 1
          fi
          echo 'LIVE_SURFACE_SMOKE_PASS'
