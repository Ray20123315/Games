name: BoardVerse declarative DO production verification

on:
  push:
    branches: [boardverse-finish-visible-deploy-v011]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install BoardVerse dependencies
        working-directory: BoardVerse
        run: npm install --no-audit --no-fund
      - name: Full regression suite
        working-directory: BoardVerse
        run: npm test
      - name: Canonical production dry-run
        working-directory: BoardVerse
        run: npx wrangler@4.127.1 deploy --dry-run --config wrangler.jsonc --outdir /tmp/boardverse-canonical
      - name: Root production dry-run
        run: npx --yes wrangler@4.127.1 deploy --dry-run --config wrangler.jsonc --outdir /tmp/boardverse-root
      - name: Assert declarative exports
        run: |
          grep -q '"exports"' wrangler.jsonc
          grep -q '"GameRoom"' wrangler.jsonc
          grep -q '"GameRoomV011"' wrangler.jsonc
          grep -q '"BoardVerseDbV011"' wrangler.jsonc
          ! grep -q '"migrations"' wrangler.jsonc
