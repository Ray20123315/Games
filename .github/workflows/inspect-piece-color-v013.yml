name: Verify BoardVerse v0.0.13 piece colors
on:
  push:
    branches: [hotfix/piece-color-visibility-v0.0.13]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v0.0.13
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node post-build-v012.mjs
          node post-build-v013.mjs
          node --check worker.js
      - name: Verify piece color markers
        working-directory: BoardVerse
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('worker.js').read_bytes()
          s=b.decode()
          expected='5e86536425ca0749ef970a442e8307245bf5149f37ded06e144c10cc509c3dea'
          actual=hashlib.sha256(b).hexdigest()
          assert actual == expected, (actual, expected)
          markers=[
              'const APP_VERSION = "0.0.13";',
              'background-color:#050607',
              'background-color:#f4f6f8',
              'background-image:radial-gradient(circle at 35% 25%,#fff 0,#e8edf2 48%,#aab3bd 100%)',
              "wK:'♔'", "wQ:'♕'", "wR:'♖'", "wB:'♗'", "wN:'♘'", "wP:'♙'",
              "bK:'♚'", "bQ:'♛'", "bR:'♜'", "bB:'♝'", "bN:'♞'", "bP:'♟'",
              "s.className='stone '+(p==='B'?'black':'white')"
          ]
          missing=[m for m in markers if m not in s]
          assert not missing, missing
          print('Verified v0.0.13 worker:', len(b), 'bytes', actual)
          PY
