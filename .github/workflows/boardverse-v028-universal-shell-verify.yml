name: BoardVerse v028 universal shell verify

on:
  push:
    branches:
      - boardverse-universal-shell-v028
    paths:
      - "BoardVerse/**"
      - ".github/workflows/boardverse-v028-universal-shell-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: BoardVerse
    steps:
      - name: Checkout staging commit
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Targeted v028 syntax and regression
        run: |
          node --check src/ui/theme-hardening.js
          node --check src/ui/theme-surface-fix.js
          node --check src/ui/page-parity-v028.js
          node --check src/cards/room.js
          node --check src/cards/routes.js
          node --check src/cards/d1.js
          node --check src/cards/do-room.js
          node test/ui-parity-v028.test.mjs
      - name: Canonical BoardVerse build gate
        run: node build-worker.mjs
