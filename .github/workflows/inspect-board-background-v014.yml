name: Inspect BoardVerse v0.0.14 background UI
on:
  push:
    branches: [feature/user-board-background-v0.0.14]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v0.0.13
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node post-build-v012.mjs
          node post-build-v013.mjs
          node --check worker.js
      - name: Inspect exact background hooks
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const source = await readFile('worker.js','utf8');
          for (const needle of ['.sq.light','.sq.dark','.chess-board','.reversi-board','function renderIntersectionBoard','languageSelect\').addEventListener','applyLanguage();','soundEnabled\').addEventListener']) {
            let start = 0, count = 0;
            while ((start = source.indexOf(needle, start)) >= 0 && count < 5) {
              const a = Math.max(0, start - 900), b = Math.min(source.length, start + needle.length + 1800);
              console.log(`\n--- ${needle} @ ${start} ---\n${source.slice(a,b)}\n`);
              start += needle.length; count++;
            }
          }
          NODE
