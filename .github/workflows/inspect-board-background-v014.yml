name: Verify BoardVerse v0.0.14 board background
on:
  push:
    branches: [feature/user-board-background-v0.0.14]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v0.0.14
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node post-build-v012.mjs
          node post-build-v013.mjs
          node post-build-v014.mjs
          node --check worker.js
      - name: Verify background preference markers
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const source = await readFile('worker.js','utf8');
          const expected = '1c6553c435c521a2b66bb757e78b28e6f78172193a5f8bd0d261b5bb3cb841ea';
          const actual = createHash('sha256').update(source).digest('hex');
          if(actual !== expected) throw new Error('worker SHA mismatch: '+actual);
          for(const marker of [
            'const APP_VERSION = "0.0.14";',
            'id="boardBgColor" type="color"',
            'id="boardBgReset"',
            "localStorage.getItem('boardverseBoardBackground')",
            "localStorage.setItem('boardverseBoardBackground',v)",
            "localStorage.removeItem('boardverseBoardBackground')",
            'body.custom-board-bg .line-board',
            'body.custom-board-bg .xiangqi-board',
            'body.custom-board-bg .chess-board .sq.light',
            'body.custom-board-bg .chess-board .sq.dark',
            'body.custom-board-bg .reversi-board .sq.light',
            "lang==='en'?'Board background'"
          ]) if(!source.includes(marker)) throw new Error('missing marker: '+marker);
          console.log('Verified BoardVerse v0.0.14 SHA-256 '+actual);
          NODE
