name: BoardVerse source artifact

on:
  push:
    branches:
      - boardverse-full-plan-v010

permissions:
  contents: read

jobs:
  source-artifact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boardverse-full-plan-v010
      - uses: actions/upload-artifact@v4
        with:
          name: boardverse-v023-source
          path: |
            BoardVerse/.migration/current-worker-v023.js
            BoardVerse/.migration/current-worker-v023.sha256
            BoardVerse/.migration/current-worker-v023.symbols.txt
          if-no-files-found: error
          retention-days: 1
