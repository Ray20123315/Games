name: Verify Cloudflare BoardVerse root
on:
  push:
    branches: [hotfix/cloudflare-boardverse-root-v0.0.24]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reproduce Cloudflare build command
        working-directory: BoardVerse
        run: node build-worker.mjs
      - name: Reproduce Cloudflare deploy command safely
        working-directory: BoardVerse
        run: npx --yes wrangler@4.127.1 deploy --dry-run
      - name: Verify final worker
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const s=await readFile('worker.js','utf8');
          const h=createHash('sha256').update(s).digest('hex');
          if(!s.includes('const APP_VERSION = "0.0.24";')) throw new Error('v0.0.24 marker missing');
          if(h!=='bf661f6d7f09c21742d0d75fd2cda4825d270136ef5a64d70399c69769ee2ed7') throw new Error('unexpected worker hash '+h);
          console.log('FINAL_V024_BYTES='+Buffer.byteLength(s));
          console.log('FINAL_V024_SHA256='+h);
          NODE
