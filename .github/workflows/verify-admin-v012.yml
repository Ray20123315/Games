name: Verify BoardVerse v0.1.2 admin workbench
on:
  push:
    branches: [feat/admin-workbench-v0.1.2]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: BoardVerse
        run: npm install --no-audit --no-fund
      - name: Full regression suite
        working-directory: BoardVerse
        run: npm test
      - name: 16:9 admin layout smoke test
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { adminDashboardPage } from './src/admin/pages.js';
          let html=await adminDashboardPage().text();
          const probe=`<script>(function(){var f=document.getElementById('adminFrame'),o=document.getElementById('out'),r=f.getBoundingClientRect(),ratio=r.width/r.height,body=getComputedStyle(document.body),scroll=getComputedStyle(o);var ok=Math.abs(ratio-(16/9))<.02&&r.left>=-1&&r.top>=-1&&r.right<=innerWidth+1&&r.bottom<=innerHeight+1&&body.overflowX==='hidden'&&body.overflowY==='hidden'&&scroll.overflowY==='auto';document.body.dataset.layout=ok?'ok':'bad';document.body.dataset.frame=Math.round(r.width)+'x'+Math.round(r.height);document.body.dataset.ratio=ratio.toFixed(4)})();</script>`;
          html=html.replace('</body>',probe+'</body>');
          await writeFile('admin-layout-test.html',html);
          NODE
          google-chrome --headless --no-sandbox --disable-gpu --window-size=1600,900 --dump-dom file://$PWD/admin-layout-test.html > admin-layout-dump.html 2>/dev/null
          grep -o 'data-layout="[^"]*"' admin-layout-dump.html
          grep -o 'data-frame="[^"]*"' admin-layout-dump.html
          grep -q 'data-layout="ok"' admin-layout-dump.html
      - name: Wrangler dry run
        working-directory: BoardVerse
        run: npx wrangler@4.127.1 deploy --dry-run --outdir dist --config wrangler.jsonc
