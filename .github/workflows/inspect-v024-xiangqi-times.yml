name: Verify BoardVerse v0.0.24 simulated
on:
  push:
    branches: [feature/xiangqi-variants-room-times-v0.0.24]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Build simulated v0.0.24
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          for v in 009 010 011 012 013 014 015 016 017 018 019 020 021 022 023; do node post-build-v${v}.mjs; done
          node sim-v024.mjs
          node --check worker.js
      - name: Verify markers and hash
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const s=await readFile('worker.js','utf8');
          const markers=[
            'const APP_VERSION = "0.0.24";',
            'id: "banqi"',
            'id: "xiangqi_random"',
            'function newBanqi',
            'function applyBanqi',
            'function newRandomXiangqi',
            'out?.type === "banqi"',
            'action === "flip"',
            'className=\'board banqi-board\'',
            '七國象棋（需要 7 人房間）',
            '廣象戲（完整規則已失傳）',
            'room.startedAt = Date.now()',
            'room.endedAt = Date.now()',
            'startedAt: Number(r.startedAt) || 0',
            'function roomTimingText',
            'roomDurationText((end||Date.now())-start)'
          ];
          for(const marker of markers) if(!s.includes(marker)) throw new Error('missing '+marker);
          const bytes=Buffer.byteLength(s), sha=createHash('sha256').update(s).digest('hex');
          console.log('V024_BYTES='+bytes);
          console.log('V024_SHA256='+sha);
          NODE
