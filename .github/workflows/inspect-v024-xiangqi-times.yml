name: Inspect BoardVerse v0.0.24 anchors
on:
  push:
    branches: [feature/xiangqi-variants-room-times-v0.0.24]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Build v0.0.23
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          for v in 009 010 011 012 013 014 015 016 017 018 019 020 021 022 023; do node post-build-v${v}.mjs; done
      - name: Extract anchors
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';const s=await readFile('worker.js','utf8');
          const picks=['lobbyRecord() {','function sanitizeReplayMove','function roomView','var SERVER_GAMES','function gameText','function sideName','function makePublicRoomRow','function renderGameBoard','function intrinsicBoardSize','function boardClick','function xqPiece','<select id="gameId"'];
          for(const n of picks){let p=s.indexOf(n);console.log('\n@@'+n+' '+p);if(p>=0)console.log(s.slice(Math.max(0,p-500),p+5000).replace(/\n/g,'\\n'));}
          NODE
