name: BoardVerse explicit live Worker deploy verification

on:
  push:
    branches: [boardverse-explicit-live-deploy-v011]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: BoardVerse
        run: npm install --no-audit --no-fund
      - name: Preview-safe build gate
        working-directory: BoardVerse
        run: node build-worker.mjs
      - name: Verify production override bypass
        working-directory: BoardVerse
        run: |
          node --check build-worker.mjs
          grep -q 'delete deployEnv.WRANGLER_CI_OVERRIDE_NAME' build-worker.mjs
          grep -q 'explicit production deploy to' build-worker.mjs
          grep -q 'preview/local build: explicit live Worker deploy skipped' build-worker.mjs
          grep -q '"name": "crimson-haze-0a4d"' wrangler.jsonc
