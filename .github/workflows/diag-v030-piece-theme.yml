name: Diagnose v0.0.30 piece theme
on:
  push:
    branches: [fix/piece-theme-v0.0.30]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build current worker and inspect piece CSS
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          for v in 009 010 011 012 013 014 015 016 017 018 019 020 021 022 023 024 025 026 027 028 029; do node post-build-v${v}.mjs; done
          node --check worker.js
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const s=await readFile('worker.js','utf8');
          const style=s.match(/<style>([\s\S]*?)<\/style>/)?.[1];
          if(!style) throw new Error('style block not found');
          const html=`<!doctype html><meta charset="utf-8"><style>${style}</style><body><div id="stone" class="stone white"></div><span id="chess" class="chess-piece white">♔</span><span id="qiguo" class="qiguo-piece" style="background:#f2eee3;color:#17130b">秦</span><pre id="out"></pre><script>function snap(cls){document.body.className=cls;let a=getComputedStyle(stone),b=getComputedStyle(chess),c=getComputedStyle(qiguo);return{theme:cls,stoneBg:a.backgroundColor,stoneImage:a.backgroundImage,chessColor:b.color,qiguoBg:c.backgroundColor,qiguoColor:c.color}}out.textContent=JSON.stringify([snap('page-theme-white'),snap('page-theme-black')]);</script></body>`;
          await writeFile('piece-theme-test.html',html);
          NODE
          google-chrome --headless --no-sandbox --disable-gpu --dump-dom file://$PWD/piece-theme-test.html > piece-theme-dump.html 2>/dev/null
          grep '<pre id="out">' piece-theme-dump.html
