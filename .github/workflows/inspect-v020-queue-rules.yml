          replaceExact("if(btn){var h=HELP[btn.getAttribute('data-help')],key=lang==='en'?'en':lang==='zh-Hans'?'zhHans':'zhHant';if(h&&h[key])openHelp(btn,h[key][0],h[key][1]);return}", "if(btn){var helpKey=btn.getAttribute('data-help');if(helpKey==='rotation'){var rt=lang==='en'?'Winner stays: loser rotates out; on a draw both rotate. Rotate both: both players rotate out after every game. Host stays: the room host always keeps the seat and only the opponent rotates.':lang==='zh-Hans'?'胜者留桌：有胜负时败者转观众、下一位补上；和棋双方轮替。双方轮替：每局结束两位玩家都转观众，再依排队顺序补位。房主留桌：房主固定不动，每局只轮替对手并由排队下一位补上。':'勝者留桌：有勝負時敗者轉觀眾、下一位補上；和棋雙方輪替。雙方輪替：每局結束兩位玩家都轉觀眾，再依排隊順序補位。房主留桌：房主固定不動，每局只輪替對手並由排隊下一位補上。';openHelp(btn,lang==='en'?'Rotation policy':'輪替方式',rt);return}var h=HELP[helpKey],key=lang==='en'?'en':lang==='zh-Hans'?'zhHans':'zhHant';if(h&&h[key])openHelp(btn,h[key][0],h[key][1]);return}", 'rotation help text');
