name: Verify BoardVerse v0.0.20 queue and rule details
on:
  push:
    branches: [feature/queue-rule-details-v0.0.20]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v0.0.20
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node post-build-v012.mjs
          node post-build-v013.mjs
          node post-build-v014.mjs
          node post-build-v015.mjs
          node post-build-v016.mjs
          node post-build-v017.mjs
          node post-build-v018.mjs
          node post-build-v019.mjs
          node post-build-v020.mjs
          node --check worker.js
      - name: Verify generated worker
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const s=await readFile('worker.js','utf8');
          const bytes=Buffer.byteLength(s);
          const sha=createHash('sha256').update(s).digest('hex');
          if(bytes!==209032)throw new Error('unexpected bytes '+bytes);
          if(sha!=='e27a48a4197e94f3f8ef68502b6133cff2e57db29261ef107d86702990049b05')throw new Error('unexpected sha '+sha);
          const markers=[
            'const APP_VERSION = "0.0.20";',
            'room.settings.rotationPolicy === "host_stays"',
            'seated.find((m) => m?.isOwner)',
            'room.queue.shift()',
            '房主留桌（對手輪替）',
            'RULE_OPTION_DETAIL_I18N',
            'openGameRuleDetails',
            'game-rule-detail-btn',
            '詳細了解規則設定',
            'BoardVerse 的 AGA 預設採 Area',
            'Positional Superko 盤面超劫',
            'Capture Go 吃子棋',
            '讓子'
          ];
          for(const marker of markers)if(!s.includes(marker))throw new Error('missing '+marker);
          if((s.match(/value="host_stays"/g)||[]).length!==2)throw new Error('host_stays UI option count mismatch');
          if((s.match(/\["winner_stays", "rotate_both", "host_stays"\]/g)||[]).length<2)throw new Error('host_stays backend validation missing');
          console.log('Verified v0.0.20 '+bytes+' bytes '+sha);
          NODE
