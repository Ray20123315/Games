name: Inspect BoardVerse v0.0.20 queue and rule detail markers
on:
  push:
    branches: [feature/queue-rule-details-v0.0.20]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build current worker
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node post-build-v012.mjs
          node post-build-v013.mjs
          node post-build-v014.mjs
          node post-build-v015.mjs
          node post-build-v016.mjs
          node post-build-v017.mjs
          node post-build-v018.mjs
          node post-build-v019.mjs
          node --check worker.js
      - name: Print exact insertion contexts
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const s=await readFile('worker.js','utf8');
          for(const needle of ['rotation:"輪替方式"','rotation:"轮换方式"','rotation:"Rotation"','<select id="rotationCreate"','<select id="rotationRoom"','function renderGameCatalog()','rotateAfterMatch(result)','async queueSettings(token, msg)','function defaultRoomSettings(input = {})','.game-card{']){
            const i=s.indexOf(needle);console.log('\n### '+needle+' @ '+i);if(i>=0)console.log(s.slice(Math.max(0,i-1200),i+6500));
          }
          NODE
