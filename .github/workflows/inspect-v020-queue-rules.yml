          const newCatalog="function renderGameCatalog(){var sel=$('gameId'),current=sel.value;sel.textContent='';$('gameList').textContent='';var fiveGroup=document.createElement('optgroup');fiveGroup.label=lang==='en'?'Gomoku & variants':lang==='zh-Hans'?'五子棋与变种':'五子棋與變種';Object.keys(SERVER_GAMES).forEach(function(id){var o=document.createElement('option');o.value=id;o.textContent=id==='renju'?gameText(id,0)+(lang==='en'?' (Gomoku variant)':lang==='zh-Hans'?'（五子棋变种）':'（五子棋變種）'):gameText(id,0);if(id==='gomoku'||id==='renju')fiveGroup.appendChild(o);else sel.appendChild(o);var c=document.createElement('article');c.className='game-card';var detail=document.createElement('button');detail.type='button';detail.className='btn ghost game-rule-detail';detail.textContent=ruleDetailsLabel();detail.addEventListener('click',function(){openGameRuleDetails(id)});var st=document.createElement('strong');st.textContent=gameText(id,0);var p=document.createElement('p');p.textContent=gameText(id,1);c.appendChild(detail);c.appendChild(st);c.appendChild(p);$('gameList').appendChild(c)});sel.appendChild(fiveGroup);if(current&&SERVER_GAMES[current])sel.value=current;renderRuleFields()}";
