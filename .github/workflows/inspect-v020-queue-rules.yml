name: Simulate BoardVerse v0.0.20 queue and rule details
on:
  push:
    branches: [feature/queue-rule-details-v0.0.20]
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build through v0.0.20
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node post-build-v012.mjs
          node post-build-v013.mjs
          node post-build-v014.mjs
          node post-build-v015.mjs
          node post-build-v016.mjs
          node post-build-v017.mjs
          node post-build-v018.mjs
          node post-build-v019.mjs
          node post-build-v020.mjs
          node --check worker.js
          sha256sum worker.js
          wc -c worker.js
      - name: Verify feature markers
        working-directory: BoardVerse
        run: |
          grep -q 'const APP_VERSION = "0.0.20";' worker.js
          test "$(grep -o 'value="host_stays"' worker.js | wc -l)" -eq 2
          grep -q 'RULE_OPTION_DETAIL_I18N' worker.js
          grep -q 'openGameRuleDetails' worker.js
          grep -q '詳細了解規則設定' worker.js
          grep -q 'BoardVerse 的 AGA 預設採 Area' worker.js
