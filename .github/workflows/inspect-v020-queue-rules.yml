name: Verify BoardVerse v0.0.20 queue and rule details
on:
  push:
    branches: [feature/queue-rules-v0.0.20]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v0.0.20
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node post-build-v012.mjs
          node post-build-v013.mjs
          node post-build-v014.mjs
          node post-build-v015.mjs
          node post-build-v016.mjs
          node post-build-v017.mjs
          node post-build-v018.mjs
          node post-build-v019.mjs
          node post-build-v020.mjs
          node --check worker.js
      - name: Verify v0.0.20 markers and hash
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const s=await readFile('worker.js','utf8');
          const bytes=Buffer.byteLength(s);
          const sha=createHash('sha256').update(s).digest('hex');
          if(bytes!==201387)throw new Error('unexpected bytes '+bytes);
          if(sha!=='d8da127137b9426f0a3d46baec5697ff9abf6aaf3299f8dfc4df88762dc5ce28')throw new Error('unexpected sha '+sha);
          for(const marker of ['const APP_VERSION = "0.0.20";','host_stays','房主留桌','hostStays ? !member.isOwner','詳細了解規則設定','buildRuleDetailNode','game-rule-detail','Area 面積計分','Territory 地計分','Komi 7.5','Positional Superko','Capture Go','選項：是 / 否','讓子'])if(!s.includes(marker))throw new Error('missing '+marker);
          for(const forbidden of ["lab.appendChild(inf);row.appendChild(lab)","rhs.appendChild(inf)"])if(s.includes(forbidden))throw new Error('forbidden '+forbidden);
          const i=s.indexOf('function openModal');
          if(i<0)throw new Error('openModal missing');
          console.log('OPEN_MODAL_CONTEXT='+s.slice(i,i+900).replaceAll('\n',' '));
          console.log('Verified v0.0.20 '+bytes+' bytes '+sha);
          NODE
