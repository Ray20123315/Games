name: Simulate BoardVerse v0.0.20 queue and rule details
on:
  push:
    branches: [feature/queue-rules-v0.0.20]
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v0.0.19
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node post-build-v012.mjs
          node post-build-v013.mjs
          node post-build-v014.mjs
          node post-build-v015.mjs
          node post-build-v016.mjs
          node post-build-v017.mjs
          node post-build-v018.mjs
          node post-build-v019.mjs
          node --check worker.js
      - name: Simulate v0.0.20
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          let source=await readFile('worker.js','utf8');
          function replaceExact(from,to,label){const first=source.indexOf(from);if(first<0)throw new Error(label+' marker not found');if(source.indexOf(from,first+from.length)>=0)throw new Error(label+' marker not unique');source=source.replace(from,to)}
          replaceExact('const APP_VERSION = "0.0.19";','const APP_VERSION = "0.0.20";','version');
          replaceExact('rotationPolicy: input.rotationPolicy === "rotate_both" ? "rotate_both" : "winner_stays",','rotationPolicy: ["winner_stays", "rotate_both", "host_stays"].includes(input.rotationPolicy) ? input.rotationPolicy : "winner_stays",','default queue policy');
          replaceExact('if (["winner_stays", "rotate_both"].includes(msg.rotationPolicy)) room.settings.rotationPolicy = msg.rotationPolicy;','if (["winner_stays", "rotate_both", "host_stays"].includes(msg.rotationPolicy)) room.settings.rotationPolicy = msg.rotationPolicy;','queue settings policy');
          replaceExact('const rotateBoth = room.settings.rotationPolicy === "rotate_both" || !winner;','const hostStays = room.settings.rotationPolicy === "host_stays";\n    const rotateBoth = !hostStays && (room.settings.rotationPolicy === "rotate_both" || !winner);','host stays rotation flag');
          replaceExact('if (rotateBoth || member.id !== winner.id) this.moveToSpectator(member);','if (hostStays ? !member.isOwner : (rotateBoth || member.id !== winner.id)) this.moveToSpectator(member);','host stays seat preservation');
          replaceExact('<select id="rotationCreate"><option value="winner_stays" data-i18n="winnerStays">勝者留桌</option><option value="rotate_both" data-i18n="rotateBoth">雙方輪替</option></select>','<select id="rotationCreate"><option value="winner_stays" data-i18n="winnerStays">勝者留桌</option><option value="rotate_both" data-i18n="rotateBoth">雙方輪替</option><option value="host_stays">房主留桌</option></select>','create queue policy option');
          replaceExact('<select id="rotationRoom"><option value="winner_stays" data-i18n="winnerStays">勝者留桌</option><option value="rotate_both" data-i18n="rotateBoth">雙方輪替</option></select>','<select id="rotationRoom"><option value="winner_stays" data-i18n="winnerStays">勝者留桌</option><option value="rotate_both" data-i18n="rotateBoth">雙方輪替</option><option value="host_stays">房主留桌</option></select>','room queue policy option');
          replaceExact('.game-card{border:1px solid var(--line);border-radius:13px;background:#0d141e;padding:12px}.game-card strong{font-size:14px}.game-card p{font-size:12px;line-height:1.55;color:var(--muted);margin:5px 0 0}', '.game-card{position:relative;border:1px solid var(--line);border-radius:13px;background:#0d141e;padding:12px;padding-top:43px}.game-card strong{font-size:14px}.game-card p{font-size:12px;line-height:1.55;color:var(--muted);margin:5px 0 0}.game-rule-detail{position:absolute;right:8px;top:8px;min-height:27px;padding:4px 8px;border-radius:8px;font-size:11px}.rule-detail-list{display:grid;gap:10px}.rule-detail-item{border:1px solid var(--line);border-radius:11px;padding:10px;background:var(--panel3)}.rule-detail-item strong{display:block;margin-bottom:5px}.rule-detail-item p{margin:4px 0;line-height:1.6}.rule-detail-options{margin:7px 0 0;padding-left:19px}.rule-detail-options li{margin:5px 0;line-height:1.5}', 'game card detail css');
