name: BoardVerse v0.1.0 v0.0.29 Finalize

on:
  push:
    branches:
      - boardverse-v010-final-v029

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build exact BoardVerse v0.0.29 runtime
        shell: bash
        run: |
          set -euo pipefail
          cd BoardVerse
          node build-worker.mjs \
            && node post-build-v009.mjs \
            && node post-build-v010.mjs \
            && node post-build-v011.mjs \
            && node post-build-v012.mjs \
            && node post-build-v013.mjs \
            && node post-build-v014.mjs \
            && node post-build-v015.mjs \
            && node post-build-v016.mjs \
            && node post-build-v017.mjs \
            && node post-build-v018.mjs \
            && node post-build-v019.mjs \
            && node post-build-v020.mjs \
            && node post-build-v021.mjs \
            && node post-build-v022.mjs \
            && node post-build-v023.mjs \
            && node post-build-v024.mjs \
            && node post-build-v025.mjs \
            && node post-build-v026.mjs \
            && node post-build-v027.mjs \
            && node post-build-v028.mjs \
            && node post-build-v029.mjs
          echo '650d3f3e2931dc6ac214f0bbb3cea093ef6693b66e18ec020650e98ad35f043a  worker.js' | sha256sum -c -
          cp worker.js /tmp/runtime-v029.js

      - name: Reconstruct verified modular overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .migration/boardverse-v029-overlay/chunk-*.txt > /tmp/boardverse-v029-overlay.b64
          base64 -d /tmp/boardverse-v029-overlay.b64 > /tmp/boardverse-v029-overlay.tar.gz
          echo 'df3f024264a783d52b2426ec37adbfaae357e76236f30034d0b5f5edb7c7c646  /tmp/boardverse-v029-overlay.tar.gz' | sha256sum -c -

      - name: Install source-only modular BoardVerse
        shell: bash
        run: |
          set -euo pipefail
          rm -rf BoardVerse
          mkdir -p BoardVerse
          tar -xzf /tmp/boardverse-v029-overlay.tar.gz -C BoardVerse
          rm -f BoardVerse/build-worker.mjs
          mkdir -p BoardVerse/src/legacy
          cp /tmp/runtime-v029.js BoardVerse/src/legacy/runtime-v029.js
          echo '650d3f3e2931dc6ac214f0bbb3cea093ef6693b66e18ec020650e98ad35f043a  BoardVerse/src/legacy/runtime-v029.js' | sha256sum -c -

      - name: Syntax and regression tests
        shell: bash
        run: |
          set -euo pipefail
          find BoardVerse/src BoardVerse/test -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          cd BoardVerse
          npm install --package-lock=false
          npm test

      - name: Wrangler dry run
        shell: bash
        run: |
          set -euo pipefail
          cd BoardVerse
          npx --yes wrangler@4.127.1 deploy --dry-run --outdir dist --config wrangler.jsonc

      - name: Verify source-only authority
        shell: bash
        run: |
          set -euo pipefail
          cd BoardVerse
          test ! -e build-worker.mjs
          ! compgen -G 'post-build-v*.mjs' >/dev/null
          ! compgen -G 'sim-v*.mjs' >/dev/null
          test ! -e worker.js
          ! compgen -G '.source*' >/dev/null
          test -f src/index.js
          test -f src/legacy/runtime-v029.js
          grep -q 'runtime-v029.js' src/index.js
          grep -q 'runtime-v029.js' src/room/GameRoom.js
          grep -q 'TURNSTILE_SITE_KEY' wrangler.jsonc
          grep -q 'TURNSTILE_HOSTNAMES' wrangler.jsonc
          grep -q 'TURNSTILE_SECRET_KEY' src/reports/reports.js

      - name: Commit verified source-only integration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf BoardVerse/node_modules BoardVerse/dist BoardVerse/.wrangler
          rm -rf .migration/boardverse-v029-overlay
          rm -f .github/workflows/boardverse-v010-v029-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A BoardVerse .migration .github/workflows/boardverse-v010-v029-finalize.yml
          git status --short
          git commit -m 'BoardVerse v0.1.0: integrate modular platform on v0.0.29'
          git push origin HEAD:boardverse-v010-final-v029
