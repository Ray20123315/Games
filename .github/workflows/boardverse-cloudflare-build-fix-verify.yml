name: BoardVerse Cloudflare build fix verification

on:
  push:
    branches: [boardverse-cloudflare-build-fix-v011]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: BoardVerse
        run: npm install --no-audit --no-fund
      - name: Cloudflare build command compatibility
        working-directory: BoardVerse
        run: node build-worker.mjs
      - name: Verify deploy configuration
        working-directory: BoardVerse
        run: |
          grep -q 'xn--gmqt6w03b11v.ray2025.com/\*' wrangler.jsonc
          grep -q '"zone_name": "ray2025.com"' wrangler.jsonc
          grep -q '"custom_domain": true' wrangler.jsonc
          node --check build-worker.mjs
