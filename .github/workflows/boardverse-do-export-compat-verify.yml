name: BoardVerse DO export compatibility verification

on:
  push:
    branches: [boardverse-finish-visible-deploy-v011]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install BoardVerse dependencies
        working-directory: BoardVerse
        run: npm install --no-audit --no-fund
      - name: Full regression suite
        working-directory: BoardVerse
        run: npm test
      - name: Production Wrangler dry-run
        run: npx --yes wrangler@4.127.1 deploy --dry-run --config wrangler.jsonc --outdir /tmp/boardverse-prod
      - name: Preview Wrangler dry-run
        run: npx --yes wrangler@4.127.1 versions upload --dry-run --config wrangler.preview.jsonc --outdir /tmp/boardverse-preview
      - name: Verify compatibility exports
        run: |
          grep -q 'export class GameRoom ' BoardVerse/src/index-v011.js
          grep -q 'export class GlobalChat ' BoardVerse/src/index-v011.js
          grep -q 'export class BoardVerseDb ' BoardVerse/src/index-v011.js
          grep -q 'GameRoomV011' BoardVerse/src/cloudflare-preview.js
          grep -q 'GlobalChatV011' BoardVerse/src/cloudflare-preview.js
          grep -q 'BoardVerseDbV011' BoardVerse/src/cloudflare-preview.js
