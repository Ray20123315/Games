name: BoardVerse existing DO production verification

on:
  push:
    branches: [boardverse-finish-visible-deploy-v011]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install BoardVerse dependencies
        working-directory: BoardVerse
        run: npm install --no-audit --no-fund
      - name: Full regression suite
        working-directory: BoardVerse
        run: npm test
      - name: Canonical production dry-run
        working-directory: BoardVerse
        run: npx wrangler@4.127.1 deploy --dry-run --config wrangler.jsonc --outdir /tmp/boardverse-existing-do
      - name: Root production dry-run
        run: npx --yes wrangler@4.127.1 deploy --dry-run --config wrangler.jsonc --outdir /tmp/boardverse-root-existing-do
      - name: Assert no DO lifecycle changes
        run: |
          grep -q '"ROOMS"' wrangler.jsonc
          grep -q '"BOARDVERSE_DB_DO"' wrangler.jsonc
          grep -q '"class_name": "GameRoom"' wrangler.jsonc
          ! grep -q '"exports"' wrangler.jsonc
          ! grep -q '"migrations"' wrangler.jsonc
          grep -q 'query(mode, sql, binds = \[\])' BoardVerse/src/index-v011.js
