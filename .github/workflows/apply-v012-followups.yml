name: Apply v0.1.2 homepage follow-ups
on:
  push:
    branches: [feat/admin-workbench-v0.1.2]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: BoardVerse
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node tools/patch-v012-followups2.mjs
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Full regression suite
        run: npm test
      - name: Production dry-run
        run: npx wrangler deploy --dry-run --outdir dist --config wrangler.jsonc
      - name: Commit verified changes
        working-directory: .
        run: |
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add BoardVerse/src BoardVerse/test
          if git diff --cached --quiet; then echo 'No product changes'; exit 0; fi
          git commit -m 'fix: stabilize fresh homepage and custom creation UI'
          git push origin HEAD:feat/admin-workbench-v0.1.2
