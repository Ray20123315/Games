name: Simulate BoardVerse v0.0.19 softer theme
on:
  push:
    branches: [style/softer-theme-v0.0.19]
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v0.0.18
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node post-build-v012.mjs
          node post-build-v013.mjs
          node post-build-v014.mjs
          node post-build-v015.mjs
          node post-build-v016.mjs
          node post-build-v017.mjs
          node post-build-v018.mjs
          node --check worker.js
      - name: Simulate v0.0.19
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          let source=await readFile('worker.js','utf8');
          function replaceExact(from,to,label){const first=source.indexOf(from);if(first<0)throw new Error(label+' marker not found');if(source.indexOf(from,first+from.length)>=0)throw new Error(label+' marker not unique');source=source.replace(from,to)}
          replaceExact('const APP_VERSION = "0.0.18";','const APP_VERSION = "0.0.19";','version');
          replaceExact(':root{color-scheme:dark;--bg:#080b10;--panel:#101720;--panel2:#161f2b;--panel3:#0c121a;--text:#f4f7fb;--muted:#91a0b4;--line:#273445;--accent:#d4af37;--accent2:#ffe49a;',':root{color-scheme:dark;--bg:#11100d;--panel:#17140f;--panel2:#1d1912;--panel3:#14110d;--text:#f3ede2;--muted:#aa9e8b;--line:#3b3327;--accent:#c3a15f;--accent2:#e8d9ad;','soft neutral root palette');
          replaceExact('.brand-mark{width:42px;height:42px;border:1px solid #33455c;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#1a2738,#0c121b);font-weight:900;color:var(--accent2);flex:0 0 auto}', '.brand-mark{width:42px;height:42px;border:1px solid #4a4031;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#242018,#14110d);font-weight:900;color:var(--accent2);flex:0 0 auto}', 'soft brand mark');
          replaceExact('.btn{border:1px solid #a77a00;background:linear-gradient(135deg,#8a6500 0%,#d4af37 48%,#fff0a6 100%);color:#201500;font-weight:800;min-height:40px;padding:9px 13px;border-radius:11px}', '.btn{border:1px solid #927642;background:linear-gradient(135deg,#806a3c 0%,#c3a15f 50%,#e7d7a8 100%);color:#211a0f;font-weight:800;min-height:40px;padding:9px 13px;border-radius:11px}', 'soft gold primary buttons');
          replaceExact('.btn.secondary{border-color:#35475d;background:#172333;color:#e6eef8}.btn.ghost{border-color:#35475d;background:transparent;color:#d9e5f3}', '.btn.secondary{border-color:#4b4030;background:#211c14;color:#e9e0cf}.btn.ghost{border-color:#4b4030;background:transparent;color:#e1d6c3}', 'soft neutral secondary buttons');
          replaceExact('.point-btn.selected{outline:3px solid #d4af37;outline-offset:2px}', '.point-btn.selected{outline:3px solid #c3a15f;outline-offset:2px}', 'soft board selection accent');
          replaceExact('.info-btn{width:22px;height:22px;border:1px solid #a77a00;border-radius:50%;background:linear-gradient(135deg,#8a6500,#d4af37 55%,#fff0a6);color:#201500;font-size:12px;font-weight:900;padding:0;display:inline-grid;place-items:center;flex:0 0 auto}.info-btn:focus-visible,.btn:focus-visible,.compact-btn:focus-visible,.compact-select:focus-visible,input:focus-visible,select:focus-visible,.role-choice:focus-visible{outline:3px solid rgba(212,175,55,.5);outline-offset:2px}', '.info-btn{width:22px;height:22px;border:1px solid #927642;border-radius:50%;background:linear-gradient(135deg,#806a3c,#c3a15f 55%,#e7d7a8);color:#211a0f;font-size:12px;font-weight:900;padding:0;display:inline-grid;place-items:center;flex:0 0 auto}.info-btn:focus-visible,.btn:focus-visible,.compact-btn:focus-visible,.compact-select:focus-visible,input:focus-visible,select:focus-visible,.role-choice:focus-visible{outline:3px solid rgba(195,161,95,.42);outline-offset:2px}', 'soft gold info and focus accents');
          replaceExact('.go-estimate{margin-top:8px;padding:8px 10px;border:1px solid #9b781e;border-radius:10px;background:linear-gradient(135deg,rgba(138,101,0,.2),rgba(255,240,166,.08));color:var(--text);font-size:12px;line-height:1.5}', '.go-estimate{margin-top:8px;padding:8px 10px;border:1px solid #8f7749;border-radius:10px;background:linear-gradient(135deg,rgba(128,106,60,.16),rgba(231,215,168,.07));color:var(--text);font-size:12px;line-height:1.5}', 'soft Go estimate');
          replaceExact('.theme-option[aria-checked="true"]{background:linear-gradient(135deg,#8a6500 0%,#d4af37 48%,#fff0a6 100%);color:#201500;box-shadow:0 2px 10px rgba(138,101,0,.28)}', '.theme-option[aria-checked="true"]{background:linear-gradient(135deg,#806a3c 0%,#c3a15f 50%,#e7d7a8 100%);color:#211a0f;box-shadow:0 2px 10px rgba(128,106,60,.2)}', 'soft selected theme option');
          replaceExact('body.page-theme-black{background:#000!important;color-scheme:dark}', 'body.page-theme-black{background:#11100d!important;color-scheme:dark;--bg:#11100d;--panel:#17140f;--panel2:#1d1912;--panel3:#14110d;--text:#f3ede2;--muted:#aa9e8b;--line:#3b3327;--shadow:0 18px 48px rgba(0,0,0,.24)}', 'warm charcoal theme');
          replaceExact('body.page-theme-white{background:#fff!important;color-scheme:light;--bg:#fff;--panel:#fff;--panel2:#f7f3e8;--panel3:#fff;--text:#17130b;--muted:#6d6452;--line:#d8c9a6;--shadow:0 18px 48px rgba(73,55,14,.12)}', 'body.page-theme-white{background:#f7f4ec!important;color-scheme:light;--bg:#f7f4ec;--panel:#fbf9f3;--panel2:#f0eadf;--panel3:#fffdf8;--text:#292319;--muted:#766c5d;--line:#d8cdbb;--shadow:0 18px 48px rgba(73,55,14,.09)}', 'warm ivory theme');
          replaceExact('.eyebrow,.brand-mark,.turn-banner{background:linear-gradient(135deg,#8a6500 0%,#d4af37 48%,#fff0a6 100%);-webkit-background-clip:text;background-clip:text;color:transparent}', '.eyebrow,.brand-mark,.turn-banner{background:linear-gradient(135deg,#806a3c 0%,#c3a15f 50%,#e7d7a8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}', 'soft gold text accent');
          replaceExact("if(meta)meta.setAttribute('content',v==='white'?'#ffffff':'#000000');", "if(meta)meta.setAttribute('content',v==='white'?'#f7f4ec':'#11100d');", 'soft browser theme color');
          const out=Buffer.from(source,'utf8');await writeFile('worker.js',out);
          console.log('V019_BYTES='+out.length);console.log('V019_SHA256='+createHash('sha256').update(out).digest('hex'));
          for(const marker of ['const APP_VERSION = "0.0.19";','#11100d','#f7f4ec','#c3a15f','#e7d7a8','rgba(195,161,95,.42)'])if(!source.includes(marker))throw new Error('missing '+marker);
          for(const forbidden of ['background:#000!important','background:#fff!important','--accent:#d4af37;--accent2:#ffe49a;','linear-gradient(135deg,#8a6500 0%,#d4af37 48%,#fff0a6 100%)'])if(source.includes(forbidden))throw new Error('forbidden '+forbidden);
          NODE
          node --check worker.js
