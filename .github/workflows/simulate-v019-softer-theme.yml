name: Verify BoardVerse v0.0.19 softer theme
on:
  push:
    branches: [style/softer-theme-v0.0.19]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v0.0.19
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node post-build-v012.mjs
          node post-build-v013.mjs
          node post-build-v014.mjs
          node post-build-v015.mjs
          node post-build-v016.mjs
          node post-build-v017.mjs
          node post-build-v018.mjs
          node post-build-v019.mjs
          node --check worker.js
      - name: Verify palette, contrast and hash
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const source=await readFile('worker.js','utf8');
          const bytes=Buffer.byteLength(source);
          const sha=createHash('sha256').update(source).digest('hex');
          if(bytes!==195080)throw new Error('unexpected bytes '+bytes);
          if(sha!=='75b56214219c0703cd4a3540891ad8c2eef52d8a46b885e943cbe44f7608c203')throw new Error('unexpected sha '+sha);
          for(const marker of ['const APP_VERSION = "0.0.19";','#11100d','#f7f4ec','#c3a15f','#e7d7a8','rgba(195,161,95,.42)','background:#211c14;color:#e9e0cf'])if(!source.includes(marker))throw new Error('missing '+marker);
          for(const forbidden of ['background:#000!important','background:#fff!important','--accent:#d4af37;--accent2:#ffe49a;','linear-gradient(135deg,#8a6500 0%,#d4af37 48%,#fff0a6 100%)'])if(source.includes(forbidden))throw new Error('forbidden '+forbidden);
          function luminance(hex){const rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2]}
          function contrast(a,b){let x=luminance(a),y=luminance(b);if(x<y)[x,y]=[y,x];return (x+.05)/(y+.05)}
          for(const [fg,bg,label] of [['#f3ede2','#11100d','dark text'],['#292319','#f7f4ec','light text'],['#211a0f','#c3a15f','gold button'],['#e9e0cf','#211c14','secondary button']]){const r=contrast(fg,bg);if(r<4.5)throw new Error(label+' contrast '+r);console.log(label+' contrast '+r.toFixed(2)+':1')}
          console.log('Verified v0.0.19 '+bytes+' bytes '+sha);
          NODE
