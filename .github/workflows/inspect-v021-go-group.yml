name: Verify BoardVerse v0.0.21 Go grouping
on:
  push:
    branches: [feature/group-go-sizes-v0.0.21]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build simulated v0.0.21
        working-directory: BoardVerse
        run: |
          node build-worker.mjs
          node post-build-v009.mjs
          node post-build-v010.mjs
          node post-build-v011.mjs
          node post-build-v012.mjs
          node post-build-v013.mjs
          node post-build-v014.mjs
          node post-build-v015.mjs
          node post-build-v016.mjs
          node post-build-v017.mjs
          node post-build-v018.mjs
          node post-build-v019.mjs
          node post-build-v020.mjs
          node sim-v021.mjs
          node --check worker.js
      - name: Verify grouping and print hash
        working-directory: BoardVerse
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const s=await readFile('worker.js','utf8');
          const sha=createHash('sha256').update(s).digest('hex');
          const bytes=Buffer.byteLength(s);
          for(const marker of ['const APP_VERSION = "0.0.21";','var goGroup=document.createElement(\'optgroup\')','goGroup.label=lang===\'en\'?\'Go\':lang===\'zh-Hans\'?\'围棋\':\'圍棋\'','id===\'go9\'?\'9×9\'','id===\'go13\'?\'13×13\'','id===\'go19\'?\'19×19\'','goGroup.appendChild(o)'])if(!s.includes(marker))throw new Error('missing '+marker);
          if((s.match(/goGroup\.appendChild\(o\)/g)||[]).length!==1)throw new Error('unexpected Go grouping wiring');
          console.log('V021_BYTES='+bytes);
          console.log('V021_SHA256='+sha);
          NODE
