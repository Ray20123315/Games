name: BoardVerse route reconciliation verification

on:
  push:
    branches: [boardverse-route-reconcile-v011]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: BoardVerse
        run: npm install --no-audit --no-fund
      - name: Full regression suite
        working-directory: BoardVerse
        run: npm test
      - name: Production upload dry-run
        run: npx --yes wrangler@4.127.1 versions upload --dry-run --config wrangler.jsonc --tag boardverse-route-verification --outdir /tmp/boardverse-route
      - name: Validate route reconciliation adapter
        run: |
          node --check scripts/wrangler-ci.cjs
          grep -q 'PROD_ROUTE' scripts/wrangler-ci.cjs
          grep -q "/zones/\${zoneId}/workers/routes" scripts/wrangler-ci.cjs
          grep -q "cfRequest('PUT'" scripts/wrangler-ci.cjs
          grep -q "cfRequest('POST'" scripts/wrangler-ci.cjs
          grep -q 'Worker Route verified' scripts/wrangler-ci.cjs
